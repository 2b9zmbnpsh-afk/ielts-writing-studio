function linkedModels(e){return state.models.filter(m=>m.essayId===e.id).sort(updatedSort)}
function questionSnapshot(e){return {task:e.task,category:e.category||'',type:e.type||'',topics:clone(arr(e.topics)),question:e.question||'',images:clone(arr(e.images)),questionSource:String(e.source||'')}}

function modelQuestionSource(m){let linked=getEssay(m.essayId||'');return String(linked?linked.source||'':m.questionSource||'')}
function sourceAliases(value){let p=sourceParts(value);return p.kind==='cambridge'?`剑雅 ${p.book} Test ${p.test} 剑雅${p.book} Test${p.test} Cambridge IELTS ${p.book} Test ${p.test}`:''}
function sourceFilterParts(value){let p=sourceParts(value);if(p.kind==='other'){let t=String(value||'').trim();if(/(?:真题|机考回忆|考场回忆)/.test(t))p.kind='exam';else if(/(?:老师|教师|讲义|课程)/.test(t))p.kind='teacher';else if(/(?:https?:\/\/|网站|题库|雅思哥)/i.test(t))p.kind='online'}return p}
function filterSourceValue(item,isModel){return isModel?(filter.sourceScope==='origin'?String(item.source||''):modelQuestionSource(item)):String(item.source||'')}
function matchesSource(item,isModel=false){let raw=filterSourceValue(item,isModel),p=sourceFilterParts(raw);if(filter.sourceKind==='all')return true;if(filter.sourceKind==='none')return !p.kind;if(p.kind!==filter.sourceKind)return false;if(p.kind==='cambridge')return (filter.sourceBook==='all'||filter.sourceBook===p.book)&&(filter.sourceTest==='all'||filter.sourceTest===p.test);return filter.sourceExact==='all'||filter.sourceExact==='value:'+raw}
function sourceFilters(isModel=false){let items=isModel?state.models:state.essays,values=items.map(x=>filterSourceValue(x,isModel)),parts=values.map(sourceFilterParts),books=[...new Set(parts.filter(x=>x.kind==='cambridge').map(x=>x.book))].sort((a,b)=>Number(a)-Number(b)),tests=[...new Set(parts.filter(x=>x.kind==='cambridge').map(x=>x.test))].sort((a,b)=>Number(a)-Number(b));if(filter.sourceBook!=='all'&&!books.includes(filter.sourceBook))books.push(filter.sourceBook);if(filter.sourceTest!=='all'&&!tests.includes(filter.sourceTest))tests.push(filter.sourceTest);let option=(v,l,selected)=>`<option value="${esc(v)}" ${v===selected?'selected':''}>${esc(l)}</option>`;let exact=[...new Set(values.filter(v=>sourceFilterParts(v).kind===filter.sourceKind))].sort((a,b)=>a.localeCompare(b,'zh-CN'));if(filter.sourceExact!=='all'&&!exact.includes(filter.sourceExact.slice(6)))exact.push(filter.sourceExact.slice(6));let active=filter.sourceKind!=='all'||(isModel&&filter.sourceScope!=='question');return `<div class="source-filterbar"><div class="source-filter-heading">${uiIcon('models')}<strong>来源筛选</strong>${active?btn('清除来源筛选','clear-source-filter','','small plain'):''}</div><div class="source-filter-controls">${isModel?`<label>筛选依据<select id="sourcescopefilter">${option('question','题目来源',filter.sourceScope)}${option('origin','范文出处',filter.sourceScope)}</select></label>`:''}<label>来源类型<select id="sourcekindfilter">${option('all','全部来源',filter.sourceKind)}${SOURCE_TYPES.filter(([k])=>k).map(([k,l])=>option(k,l,filter.sourceKind)).join('')}${option('none','未记录来源',filter.sourceKind)}</select></label>${filter.sourceKind==='cambridge'?`<label>剑雅册数<select id="sourcebookfilter">${option('all','全部册数',filter.sourceBook)}${books.map(b=>option(b,'剑雅 '+b,filter.sourceBook)).join('')}</select></label><label>Test 编号<select id="sourcetestfilter">${option('all','全部 Test',filter.sourceTest)}${tests.map(t=>option(t,'Test '+t,filter.sourceTest)).join('')}</select></label>`:filter.sourceKind!=='a function modelSourceInfo(m){let q=modelQuestionSource(m),linked=!!getEssay(m.essayId||'');return `<div class="model-source-info"><div><span class="muted">题目来源：</span><strong>${esc(q||'未记录')}</strong>${linked?tag('继承作文','blue'):''}</div>${m.source?`<div><span class="muted">范文出处：</span>${esc(m.source)}</div>`:''}</div>`}
function searchText(e){return [e.title,e.question,e.original,e.content,e.category,e.type,e.source,sourceAliases(e.source),e.questionSource,state.models.includes(e)?modelQuestionSource(e):'',state.models.includes(e)?sourceAliases(modelQuestionSource(e)):'',e.tags,arr(e.topics).join(' '),arr(e.reviews).map(r=>[r.original,r.corrected,r.explanation,r.type,r.improved].join(' ')).join(' '),arr(e.versions).map(v=>v.content).join(' '),e.assessment?.summary,arr(e.expressions).join(' ')].join(' ').toLowerCase()}
function essaysPage(){return head('作文题库','按 Task 1 与 Task 2 独立整理，记录完整写作过程。',btn('＋ 新增作文','new-essay',filter.task==='Task 2'?'data-task="Task 2"':'data-task="Task 1"','primary'))+`<div class="filters"><input id="qfilter" placeholder="搜索题目、来源、原文、精批、话题…" value="${esc(filter.q)}"><select id="taskfilter"><option value="all">全部 Task</option>${opt(['Task 1','Task 2'],filter.task)}</select><select id="catfilter"><option value="all">全部分类</option>${opt(filter.task==='Task 1'?TASK1:filter.task==='Task 2'?[...TOPICS,...TYPES]:[...TASK1,...TOPICS,...TYPES],filter.category)}</select><select id="statusfilter"><option value="all">全部状态</option>${opt(STATUS,filter.status)}</select>${btn(filter.favorite?'★ 已收藏':'☆ 收藏','toggle-filter','','small')}</div>${sourceFilters()}<div id="results">${essayResults()}</div>`}
function taskLibraryBlocks(items,isModel=false){const all=isModel?state.models:state.essays, noun=isModel?'范文':'作文', action=isModel?'new-model':'new-essay', label=isModel?'添加范文':'新增作文', row=isModel?modelRow:essayRow;const groups=[{task:'Task 1',subtitle:'Academic · 图表写作',match:x=>x.task==='Task 1'},{task:'Task 2',subtitle:'Academic · 议论文写作',match:x=>x.task==='Task 2'}];if(all.some(x=>!['Task 1','Task 2'].includes(x.task)))groups.push({task:'未分类',subtitle:'旧版资料 · 请打开记录补充作文类型',match:x=>!['Task 1','Task 2'].includes(x.task)});return `<div class="task-library-summary muted tiny">共 ${items.length} 篇${noun}${items.length!==all.length?'（全部 '+all.length+' 篇）':''}</div><div class="task-library-groups">${groups.filter(g=>filter.task==='all'||filter.task===g.task).map(g=>{const found=items.filter(g.match),total=all.filter(g.match).length,extra=g.task==='未分类'?'':`data-task="${g.task}"`;return `<section class="task-library-section" data-task-group="${g.task}" aria-label="${g.task} ${noun}"><div class="task-library-heading"><div class="task-library-title"><span class="task-library-kicker">${g.task==='未分类'?'UNCATEGORIZED':'WRITING LIBRARY'}</span><h2>${g.task} <span class="task-library-count">${found.length}${found.length!==total?' / '+total:''} 篇</span></h2><p>${g.subtitle}</p></div>${g.task==='未分类'?'':btn('＋ '+label,action,extra,'small')}</div>${found.length?`<div class="list">${found.map(row).join('')}</div>`:`<div class="empty task-library-empty"><span class="empty-icon">${uiIcon('empty')}</span><strong>${total?'没有符合筛选条件的'+noun:'暂无 '+g.task+' '+noun}</strong><div>${total?'调整上方的搜索或筛选条件，即可查看其他记录。':'从本板块添加资料，保存后将自动归入对应 Task。'}</div>${g.task==='未分类'||total?'':btn(label,action,extra,'primary small')}</div>`}</section>`}).join('')}</div>`}
function essayResults(){let a=state.essays.filter(e=>(filter.task==='all'||e.task===filter.task)&&(filter.category==='all'||e.category===filter.category||e.type===filter.category||arr(e.topics).includes(filter.category))&&(filter.status==='all'||e.status===filter.status)&&(!filter.favorite||e.favorite)&&matchesSource(e)&&searchText(e).includes(filter.q.toLowerCase())).sort(updatedSort);return taskLibraryBlocks(a)}
function gallery(images,editable=false){return arr(images).length?`<div class="gallery">${images.map((im,i)=>`<div class="imageitem"><img alt="${esc(im.name||'题目图片')}" src="${safeImg(im.data)}" data-action="zoom-image" data-index="${i}"><div class="imgbar"><div class="filename" title="${esc(im.name)}">${esc(im.name||'图片')}</div>${editable?btn('←','move-image',`data-index="${i}" data-dir="-1" ${i===0?'disabled':''}`,'small')+btn('→','move-image',`data-index="${i}" data-dir="1" ${i===images.length-1?'disabled':''}`,'small')+btn('移除','remove-image',`data-index="${i}"`,'small danger'):''}</div></div>`).join('')}</div>`:''}

function essayPage(){let e=getEssay();if(!e)return empty('作文不存在','返回作文题库。','nav','返回');let tabs=[['question','题目与图片'],['original','我的原文'],['feedback','逐句精批'],['assessment','整体评价'],['versions','修改版本'],['models','对应范文 ('+linkedModels(e).length+')']];let content={question:()=>`<div class="card"><h2>题目原文</h2><div class="question">${esc(e.question||'未记录文字题目')}</div>${gallery(e.images)}<div class="sep"></div><div class="row">${btn('编辑题目与分类','edit-essay')}${btn('上传 / 管理图片','edit-essay')}</div></div>`,original:()=>`<div class="card"><div class="row between"><h2>Original Essay · 我的原文</h2>${btn('编辑原文','edit-original','','primary')}</div>${e.original?`<div class="essaytext">${esc(e.original)}</div>`:empty('还没有写作原文','保存原文后即可导入逐句精批。','edit-original','输入原文')}<div class="sep"></div><div class="row between"><span class="muted tiny">原文字数：${wc(e.original)} / 建议至少 ${e.task==='Task 1'?150:250} 词</span>${btn('复制带编号原文','copy-numbered','','small')}${btn('复制 AI 精批指令','copy-prompt','','small')}</div></div>`,feedback:()=>feedbackPage(e),assessment:()=>assessmentPage(e),versions:()=>versionsPage(e),models:()=>linkedModelPage(e)}[tab]||(()=> '');return `<div class="row" style="margin-bottom:15px">${btn('← 作文题库','nav','data-page="essays"','plain')}</div>${head(titleOf(e),`${e.task} · ${category(e)} · ${fmt(e.date||e.created)}`,btn(e.favorite?'★ 已收藏':'☆ 收藏','favorite-essay')+btn('＋ 导入范文','new-linked-model',`data-id="${esc(e.id)}"`,'primary')+btn('编辑','edit-essay')+btn('删除','delete-essay','','danger'))}<div class="card"><div class="row">${tag(e.task,'blue')}${tag(e.status,e.status==='已精批'?'green':'')}${e.type?tag(e.type):''}${e.task==='Task 2'?arr(e.topics).map(t=>tag(t)).join(''):tag(e.category||'未分类')}</div><div class="question" style="margin-top:13px">${esc(e.question||'（仅图片题目）')}</div><div class="muted tiny" style="margin-top:10px;overflow-wrap:anywhere"><strong>作文来源：</strong>${esc(e.source||'未记录')}</div>${e.images?.length&&tab!=='question'?`<p class="muted tiny" style="margin-top:8px">附有 ${e.images.length} 张题目图片 · 可在「题目与图片」查看</p>`:''}<div class="row muted tiny" style="margin-top:12px"><span>${wc(e.original)} 词</span><span>·</span><span>${arr(e.reviews).length} 条精批</span><span>·</span><span>${arr(e.versions).length} 个修改版本</span><span>·</span><span>${linkedModels(e).length} 篇范文</span></div></div><div class="tabs">${tabs.map(([id,l])=>btn(l,'tab',`data-tab="${id}"`,tab===id?'active':'')).join('')}</div>${content()}`}

function markdown(s){let lines=String(s||'').replace(/\r\n?/g,'\n').split('\n'),out=[],list='',fence=false,code=[];const close=()=>{if(list){out.push(`</${list}>`);list=''}};for(let i=0;i<lines.length;i++){let l=lines[i];if(/^\s*```/.test(l)){close();if(fence){out.push('<pre>'+esc(code.join('\n'))+'</pre>');code=[]}fence=!fence;continue}if(fence){code.push(l);continue}if(!l.trim()){close();continue}let h=l.match(/^\s*(#{1,6})\s+(.+)/);if(h){close();let n=Math.min(4,h[1].length+1);out.push(`<h${n}>${inline(h[2])}</h${n}>`);continue}if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(l)){close();out.push('<hr>');continue}if(l.includes('|')&&i+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[i+1])){close();let cells=x=>x.trim().replace(/^\||\|$/g,'').split('|').map(c=>inline(c.trim()));out.push('<table><thead><tr>'+cells(l).map(c=>`<th>${c}</th>`).join('')+'</tr></thead><tbody>');i++;while(i+1<lines.length&&lines[i+1].includes('|')&&lines[i+1].trim()){i++;out.push('<tr>'+cells(lines[i]).map(c=>`<td>${c}</td>`).join('')+'</tr>')}out.push('</tbody></table>');continue}let m=l.match(/^\s*([-+*]|\d+[.)])\s+(.+)/);if(m){let t=/^\d/.test(m[1])?'ol':'ul';if(list!==t){close();list=t;out.push(`<${t}>`)}out.push(`<li>${inline(m[2])}</li>`);continue}close();if(/^\s*>/.test(l))out.push('<blockquote>'+inline(l.replace(/^\s*>\s?/,''))+'</blockquote>');else out.push('<p>'+inline(l)+'</p>')}close();if(fence)out.push('<pre>'+esc(code.join('\n'))+'</pre>');return `<div class="md">${out.join('')}</div>`}
function splitSentences(text){let result=[];String(text||'').trim().split(/\n\s*\n+/).forEach((p,pi)=>{p=p.trim();if(!p)return;let segs;if(typeof Intl.Segmenter==='function'){segs=Array.from(new Intl.Segmenter('en',{granularity:'sentence'}).segment(p),x=>x.segment.trim()).filter(Boolean)}else segs=p.match(/[^.!?]+(?:[.!?]+[”"']*|$)/g)||[p];let combined=[];for(let s of segs){s=s.trim();if(!s)continue;if(combined.length&&/(?:\b(?:Mr|Mrs|Ms|Dr|Prof|Sr|Jr|vs|etc|e\.g|i\.e)\.|\b[A-Z]\.)$/i.test(combined.at(-1)))combined[combined.length-1]+=' '+s;else combined.push(s)}combined.forEach((s,si)=>result.push({key:`P${pi+1}-S${si+1}`,text:s}))});return result}
function norm(s){return String(s||'').normalize('NFKC').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=norm(a).toLowerCase();b=norm(b).toLowerCase();if(!a||!b)return 0;if(a===b)return 1;let A=a.split(/\s+/),B=b.split(/\s+/),set=new Set(B),common=A.filter(x=>set.has(x)).length;return 2*common/(A.length+B.length)}
const fieldAliases={original:['原句','原文','original','original sentence','original text'],corrected:['修改后','修改句','修改后句子','修正后','改正后','修改建议','corrected','correction','corrected sentence','revised sentence','revision'],type:['错误类型','问题类型','error type','type','category'],explanation:['修改原因','原因','解释','批改说明','问题分析','explanation','reason','feedback','analysis'],improved:['更高级的表达','高级表达','优化表达','更好的表达','更高级表达','improved expression','better expression','alternative','improved'],personal:['个人理解','我的理解','personal notes']};
function identifyField(label){let l=label.trim().toLowerCase().replace(/[：:]$/,'').trim();return Object.keys(fieldAliases).find(k=>fieldAliases[k].includes(l))}
function cleanFieldLine(line){let s=line.trim().replace(/^[-*+]\s+/,'').replace(/^\d+[.)]\s+/,'');let m=s.match(/^\*\*([^*]+?)\*\*\s*[:：]?\s*(.*)$/)||s.match(/^__([^_]+?)__\s*[:：]?\s*(.*)$/)||s.match(/^([^:：]{1,45})[:：]\s*(.*)$/);if(!m)return null;let key=identifyField(m[1]);return key?[key,m[2]]:null}
function parseMarkdown(raw){let lines=String(raw||'').replace(/\r\n?/g,'\n').split('\n'),blocks=[],current=null,fieldName='',overall=[],section='none';const flush=()=>{if(current&&Object.keys(current).some(k=>k!=='key'&&String(current[k]).trim())){for(let k of Object.keys(current))current[k]=String(current[k]).trim().replace(/\n\s*[-*_]{3,}\s*$/,'').trim();blocks.push(current)}current=null;fieldName=''};for(let l of lines){let h=l.match(/^\s*#{1,6}\s+(.+)$/), ht=h?.[1]?.replace(/\*\*/g,'').trim()||'';let key=ht.match(/\bP\s*(\d+)\s*[-–—_ ]\s*S\s*(\d+)\b/i)||l.match(/^\s*(?:[-*]\s*)?(?:\*\*)?P\s*(\d+)\s*[-–—_ ]\s*S\s*(\d+)\s*(?:\*\*)?\s*[:：]?\s*$/i);if(key){flush();current={key:`P${+key[1]}-S${+key[2]}`};section='sentences';continue}if(h&&/^(?:overall feedback|final suggestions|overall assessment|整体评价|整体反馈|总结|最终建议|总评)/i.test(ht)){flush();section='overall';overall.push(l);continue}if(h&&/^(?:sentence.by.sentence|逐句精批|逐句批改|paragraph\s+\d+|第\s*\d+\s*段)/i.test(ht)){flush();section='sentences';continue}if(/^\s*(?:```(?:markdown|md)?|---+|___+|\*\*\*+)\s*$/i.test(l))continue;let f=cleanFieldLine(l);if(f){if(f[0]==='original'&&current?.original){flush()}if(!current)current={key:''};fieldName=f[0];current[fieldName]=(current[fieldName]?current[fieldName]+'\n':'')+f[1];section='sentences';continue}if(current&&fieldName){current[fieldName]+='\n'+l;continue}if(section==='overall')overall.push(l)}flush();return {blocks,overall:overall.join('\n').trim()}}
const PROMPT=`请批改以下 IELTS Academic Writing 作文。请严格按照我提供的句子编号与原句，逐句输出 Markdown；每句一个三级标题，编号不变，原句逐字照抄，不得省略、合并或重新编号。没有明显错误也要保留该句，错误类型填 None，修改后保留原句；优化表达可填“无”。修改原因用中文，避免只堆砌所谓高级词汇。请使用以下格式，每个字段单独一行（冒号位置不限），不要使用表格：\n\n# Overall Feedback\n## Overall Band: 估计分数\n### Task Achievement / Task Response\n评价\n### Coherence and Cohesion\n评价\n### Lexical Resource\n评价\n### Grammatical Range and Accuracy\n评价\n\n# Sentence-by-Sentence Feedback\n## Paragraph 1\n### P1-S1\n**原句：**\n逐字复制原句\n**修改后：**\n修正后的句子\n**错误类型：**\nGrammar / Vocabulary / Collocation / Coherence / Task Response / Punctuation / Style / None / Other\n**修改原因：**\n具体原因\n**更高级的表达：**\n可选优化表达\n\n依次重复上述结构直至最后一句。\n# Final Suggestions\n给出可执行的改进建议。\n分数仅为练习参考，不是官方成绩。`;
const SAMPLE=`# Overall Feedback\n## Overall Band: 6.0\n### Grammatical Range and Accuracy\n注意主谓一致。\n\n# Sentence-by-Sentence Feedback\n## Paragraph 1\n### P1-S1\n**原句：**\nMany students has problems.\n**修改后：**\nMany students have problems.\n**错误类型：** Grammar\n**修改原因：** students 是复数，谓语应使用 have。\n**更高级的表达：** Many students encounter academic difficulties.\n\n### P1-S2\n**原句：** Education is important.\n**修改后：** Education is important.\n**错误类型：** None\n**修改原因：** 语法正确，可以更具体。\n**更高级的表达：** Education plays a vital role in personal development.`;
function matchBlocks(blocks,sentences){let used=new Set();return blocks.map(b=>{let exact=sentences.filter(s=>norm(s.text)===norm(b.original)&&norm(b.original));let chosen=exact.find(s=>s.key===b.key&&!used.has(s.key))||(!b.key&&exact.length===1&&!used.has(exact[0].key)?exact[0]:null);if(chosen){used.add(chosen.key);return {...b,target:chosen.key,status:'exact'}}let guess=exact.length===1?exact[0]:sentences.find(s=>s.key===b.key)||[...sentences].sort((a,c)=>similarity(c.text,b.original)-similarity(a.text,b.original))[0];return {...b,target:'',suggestion:guess&&((guess.key===b.key)||similarity(guess.text,b.original)>.45)?guess.key:'',status:exact.length>1?'ambiguous':guess&&((guess.key===b.key)||similarity(guess.text,b.original)>.45)?'review':'unmatched'}})}
function diff(a,b){let A=String(a||'').match(/\s+|[^\s]+/g)||[],B=String(b||'').match(/\s+|[^\s]+/g)||[];if(A.length*B.length>120000)return [esc(a),esc(b)];let dp=Array.from({length:A.length+1},()=>new Uint16Array(B.length+1));for(let i=A.length-1;i>=0;i--)for(let j=B.length-1;j>=0;j--)dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);let i=0,j=0,x='',y='';while(i<A.length||j<B.length){if(i<A.length&&j<B.length&&A[i]===B[j]){x+=esc(A[i++]);y+=esc(B[j++])}else if(i<A.length&&(j===B.length||dp[i+1][j]>=dp[i][j+1])){let t=A[i++];x+=/^\s+$/.test(t)?esc(t):`<span class="removed">${esc(t)}</span>`}else{let t=B[j++];y+=/^\s+$/.test(t)?esc(t):`<span class="added">${esc(t)}</span>`}}return[x,y]}
function reviewCard(r){let [a,b]=diff(r.original,r.corrected||r.original);return `<article class="card reviewcard" id="review-${esc(r.id)}"><div class="row between"><div class="row"><strong>${esc(r.key)}</strong>${tag(r.type||'未分类')}${r.mastered?tag('已掌握','green'):tag('待复习','amber')}</div>${btn('编辑','edit-review',`data-id="${esc(r.id)}"`,'small')}${btn('删除','delete-review',`data-id="${esc(r.id)}"`,'small danger')}</div><div class="compare"><div><div class="label">ORIGINAL · 原句</div><div class="english">${a}</div></div><div><div class="label">CORRECTED · 修改后</div><div class="english">${b}</div></div></div>${r.explanation?`<h3>修改原因</h3>${markdown(r.explanation)}`:''}${r.improved?`<h3>优化表达</h3>${markdown(r.improved)}`:''}${r.personal?`<h3>我的理解</h3>${markdown(r.personal)}`:''}${r.aiOriginal&&norm(r.aiOriginal)!==norm(r.original)?`<details><summary>AI 返回的原句（手动匹配）</summary><div class="prose">${esc(r.aiOriginal)}</div></details>`:''}<div class="row" style="margin-top:12px">${btn(r.mastered?'标为待复习':'标为已掌握','master-review',`data-id="${esc(r.id)}"`,'small')}${btn('＋ 保存错题笔记','review-note',`data-id="${esc(r.id)}"`,'small')}${btn('☆ 收藏表达','review-expression',`data-id="${esc(r.id)}"`,'small')}</div></article>`}

class="previewbox sourcebox prose">${esc(im.raw)}</div>${btn('复制原始 Markdown','copy-import',`data-id="${esc(im.id)}"`,'small')}</details>`).join('')}</div>`:''}`}

function showModal(title,body,footer='',opts={}){if(modal&&!closeModal())return false;modal={dirty:false,kind:opts.kind||'',data:opts.data||null,save:opts.save||null,images:opts.images||null};$('modalroot').innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalheader"><h2>${esc(title)}</h2>${btn('✕','close-modal','','plain')}</div><div class="modalbody">${body}</div><div class="modalfooter">${footer||btn('取消','close-modal')+btn('保存','save-modal','','primary')}</div></section></div>`;return true}
function closeModal(force=false){if(!modal)return true;if(!force&&modal.dirty&&!confirm('当前有未保存的内容，确定关闭吗？'))return false;modal=null;$('modalroot').innerHTML='';return true}function formData(){let f=$('editor');return f?Object.fromEntries(new FormData(f)):{} }function formWrap(html){return `<form id="editor" class="formgrid">${html}</form>`}function checkTopics(selected){return `<div class="full"><label class="field">话题标签（多选）</label><div class="row" style="margin-top:8px">${TOPICS.map(t=>`<label class="check"><input type="checkbox" name="topics" value="${esc(t)}" ${selected.includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div></div>`}function taskFields(task,obj){return task==='Task 1'?sel('图表题型','category',TASK1,obj.category||TASK1[0]):sel('题目类型','type',TYPES,obj.type||TYPES[0])+checkTopics(arr(obj.topics))}function formImages(){return `<div class="full"><label class="field">题目图片 / 图表（可上传多张）<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif" multiple></label><small>支持常用图片格式，每张建议不超过 8 MB。可点击放大。</small><div id="editGallery">${gallery(modal?.images||[],true)}</div></div>`}
const SOURCE_TYPES=[['','暂不填写'],['cambridge','剑桥雅思（剑雅）'],['exam','雅思考试真题'],['teacher','老师 / 课程资料'],['online','网站 / 题库'],['other','其他来源']];
const SOURCE_PREFIX={exam:'雅思真题',teacher:'老师 / 课程资料',online:'网站 / 题库'};
const SOURCE_PLACEHOLDER={exam:'例如：2026-11-21 真题 / 考试地区',teacher:'例如：老师讲义 / 课程第 3 节',online:'例如：雅思哥 / 网页链接',other:'请输入来源名称或网址'};
function sourceParts(value){let original=String(value||'');let text=original.trim();if(!text)return {kind:'',book:'',test:'',detail:'',original};let m=text.match(/^(?:剑桥雅思|剑雅|Cambridge(?:\s+IELTS)?)\s*(\d+)\s*Test\s*(\d+)$/i);if(m&&Number(m[1])>=1&&Number(m[2])>=1)return {kind:'cambridge',book:String(Number(m[1])),test:String(Number(m[2])),detail:'',original};for(let [kind,prefix] of Object.entries(SOURCE_PREFIX)){if(text===prefix||text.startsWith(prefix+'：')||text.startsWith(prefix+':'))return {kind,book:'',test:'',detail:text.slice(prefix.length).replace(/^[:：]\s*/,''),original}}return {kind:'other',book:'',test:'',detail:original,original}}
function sourceEditor(value,label='作文来源（选填）'){let p=sourceParts(value),books=Array.from({length:30},(_,i)=>String(i+1)),tests=['1','2','3','4'];if(p.book&&!books.includes(p.book))books.push(p.book);if(p.test&&!tests.includes(p.test))tests.push(p.test);const numbered=(xs,val,format,placeholder)=>`<option value="">${placeholder}</option>`+xs.map(x=>`<option value="${esc(x)}" ${x===val?'selected':''}>${esc(format(x))}</option>`).join('');return `<div class="full source-editor"><label class="field">${esc(label)}<select id="sourceKind">${SOURCE_TYPES.map(([k,l])=>`<option value="${k}" ${k===p.kind?'selected':''}>${esc(l)}</option>`).join('')}</select></label><div id="sourceCambridge" class="formgrid ${p.kind==='cambridge'?'':'hidden'}" style="margin-top:10px"><label class="field">剑雅册数<select id="sourceBook">${numbered(books,p.book,x=>'剑雅 '+x,'请选择册数')}</select></label><label class="field">Test 编号<select id="sourceTest">${numbered(tests,p.test,x=>'Test '+x,'请选择 Test')}</select></label></div><div id="sourceOther" class="${p.kind&&p.kind!=='cambridge'?'':'hidden'}" style="margin-top:10px"><label class="field">来源详情<input id="sourceDetail" type="text" value="${esc(p.detail)}" placeholder="${esc(SOURCE_PLACEHOLDER[p.kind]||'请输入来源')}"></label></div><div id="sourcePreview" class="tiny muted" style="margin-top:8px"></div></div>`}
function readSource(original=''){let kind=$('sourceKind').value,book=$('sourceBook').value,test=$('sourceTest').value,detail=$('sourceDetail').value.trim(),p=sourceParts(original);if(kind===p.kind&&((kind==='cambridge'&&book===p.book&&test===p.test)||(kind!=='cambridge'&&detail===p.detail.trim())))return {value:p.original};if(!kind)return {value:''};if(kind==='cambridge')return book&&test?{value:`剑桥雅思 ${book} Test ${test}`}:{error:'请选择剑雅册数和 Test 编号。'};if(kind==='other')return detail?{value:detail}:{error:'请填写其他来源，或选择暂不填写。'};return {value:SOURCE_PREFIX[kind]+(detail?'：'+detail:'')}}
function syncSourceEditor(){let kind=$('sourceKind')?.value;if(kind===undefined)return;$('sourceCambridge').classList.toggle('hidden',kind!=='cambridge');$('sourceOther').classList.toggle('hidden',!kind||kind==='cambridge');$('sourceDetail').placeholder=SOURCE_PLACEHOLDER[kind]||'请输入来源';let s=readSource(modal?.kind==='model'?(modal.data?.questionSource||''):(modal?.data?.source||''));$('sourcePreview').textContent=s.error|| (s.value?'将保存为：'+s.value:'可稍后补充，支持按来源搜索。')}
function essayEditor(e=null,task='Task 1'){let o=e||{task,status:'未开始',date:today(),images:[],topics:[]};let body=formWrap(`<div class="full">${field('自定义标题（可留空，自动使用题目）','title',o.title||'')}</div>${sel('作文类型','task',['Task 1','Task 2'],o.task)}${field('写作日期','date',o.date||today(),'date')}${sourceEditor(o.source||'')}<div id="taskFields" class="full formgrid">${taskFields(o.task,o)}</div><div class="full">${ta('英文题目（也可只上传图片）','question',o.question,4,'english')}</div><div id="imageArea" class="full"></div><div class="full">${ta('我的作文原文','original',o.original,9,'english')}</div>${sel('写作状态','status',STATUS,o.status||'未开始')}<div class="wordline" id="wordcount">${wc(o.original)} 词</div>`);if(!showModal(e?'编辑作文':'新增作文',body,'',{kind:'essay',images:clone(o.images||[]),data:o,save:async()=>{let d=formData(),images=modal.images,source=readSource(o.source||'');if(source.error){toast(source.error,true);return false}d.source=source.value;if(!d.question.trim()&&!images.length){toast('请填写题目或上传题目图片。',true);return false}let topics=[...$('editor').querySelectorAll('input[name=topics]:checked')].map(x=>x.value);if(e&&d.original!==e.original&&arr(e.reviews).length&&!confirm('修改原文可能影响已有精批匹配。旧批改仍保留，确定修改？'))return false;let id=e?.id||uid();let item={...o,...d,id,source:(d.source||'').trim(),task:d.task,category:d.task==='Task 1'?d.category:'',type:d.task==='Task 2'?d.type:'',topics:d.task==='Task 2'?topics:[],images,created:e?.created||now(),updated:now(),reviews:arr(o.reviews),imports:arr(o.imports),versions:arr(o.versions),assessment:o.assessment||{},favorite:!!o.favorite};delete item.topicsDummy;if(item.original.trim()&&item.status==='未开始')item.status='写作中';if(await commit(s=>{if(e){s.essays=s.essays.map(x=>x.id===id?item:x);s.models.forEach(m=>{if(m.essayId===id){Object.assign(m,questionSnapshot(item));m.updated=now()}})}else s.essays.push(item)})){closeModal(true);go('essay',id);return true}return false}}))return;$('imageArea').innerHTML=formImages();syncSourceEditor()}

function modelEditor(m=null,presetEssay=null,returnEssay=false,presetTask='Task 1'){let linked=presetEssay||getEssay(m?.essayId||'');let o=m||{task:linked?.task||presetTask,topics:[],images:[],expressions:[],title:linked?titleOf(linked)+' · 范文':''};if(linked)o={...o,...questionSnapshot(linked),essayId:linked.id};let metadata=linked?`<div class="full notice">关联作文：<b>${esc(titleOf(linked))}</b><br>题目、图表、分类和题目来源自动继承原作文。修改作文时会同步更新；范文正文和出处独立保存。<br><strong>题目来源：</strong>${esc(linked.source||'未记录')}</div>`:`${sel('作文类型','task',['Task 1','Task 2'],o.task)}<div id="taskFields" class="full formgrid">${taskFields(o.task,o)}</div><div class="full">${ta('对应题目','question',o.question,4,'english')}</div><div id="imageArea" class="full"></div>${sourceEditor(o.questionSource||'','题目来源（选填）')}`;let body=formWrap(`<div class="full">${field('自定义标题','title',o.title||'')}</div>${metadata}${field('参考分数（如 8.0，可留空）','band',o.band||'')}${field('范文出处（作者、书籍、网址等，可选）','source',o.source||'')}<div class="full">${ta('范文原文（可直接粘贴 Markdown 或普通文本）','content',o.content,11,'english')}<label class="field" style="margin-top:8px">或导入 TXT / Markdown 文件<input type="file" id="modelTextFile" accept=".txt,.md,.markdown,text/plain,text/markdown"></label><small>导入文件会填入上方正文，确认后点击保存。</small></div><div class="full"><details><summary>预览 Markdown</summary><div class="previewbox" id="mdpreview">${markdown(o.content)}</div></details></div><div class="full">${ta('我的分析（Markdown）','personal',o.personal,5)}</div>`);if(!showModal(m?'编辑范文':linked?'导入对应范文':'添加范文',body,'',{kind:'model',data:o,images:clone(o.images||[]),save:async()=>{let d=formData(),source=linked?{value:linked.source||''}:readSource(o.questionSource||'');if(source.error){toast(source.error,true);return false}if(!d.content.trim()){toast('请输入范文正文。',true);return false}let id=m?.id||uid(),topics=[...$('editor').querySelectorAll('input[name=topics]:checked')].map(x=>x.value);let meta=linked?questionSnapshot(linked):{task:d.task,category:d.task==='Task 1'?d.category:'' function linkExistingModel(e){let options=state.models.filter(m=>!getEssay(m.essayId||'')&&m.task===e.task);if(!options.length){toast('没有同类型的未关联范文，可以直接导入新范文。');return}simpleEditor('关联已有范文',`<div class="full notice">选择范文库中的一篇范文。关联后其题目、分类、图表和题目来源将使用当前作文的信息，原有正文、范文出处、分析和收藏表达不变。</div><label class="field full">选择范文<select name="modelId">${options.map(m=>`<option value="${esc(m.id)}">${esc(titleOf(m))}</option>`).join('')}</select></label>`,async d=>{if(!options.some(m=>m.id===d.modelId))return false;if(!confirm('确认关联，并使用当前作文的题目、分类、图表和题目来源替换范文原有题目信息？'))return false;return commit(s=>{let m=s.models.find(m=>m.id===d.modelId);Object.assign(m,questionSnapshot(e),{essayId:e.id,updated:now()})},'已关联范文')})}

function reviewEditor(r=null,key=''){let e=getEssay(),sentences=splitSentences(e.original);if(!sentences.length&&!r){toast('请先保存作文原文。',true);return}let o=r||{key,original:'',corrected:'',type:'',explanation:'',improved:'',personal:''};let selected=o.key||sentences[0]?.key;let options=sentences.map(s=>`<option value="${s.key}" ${s.key===selected?'selected':''}>${s.key} · ${esc(s.text.slice(0,110))}</option>`).join('');if(r&&!sentences.some(s=>s.key===r.key))options+=`<option value="${esc(r.key)}" selected>${esc(r.key)} · 历史原句</option>`;simpleEditor(r?'编辑逐句精批':'手动添加精批',`<label class="field full">对应原句<select name="key">${options}</select></label><div class="full">${ta('修改后','corrected',o.corrected||sentences.find(s=>s.key===selected)?.text||'',4,'english')}</div><div class="full">${field('错误类型（可自由输入）','type',o.type||'')}</div><div class="full">${ta('修改原因（Markdown）','explanation',o.explanation,5)}</div><div class="full">${ta('更好的表达','improved',o.improved,3)}</div><div class="full">${ta('我的理解','personal',o.personal,3)}</div>`,async d=>{let sentence=sentences.find(s=>s.key===d.key);if(!sentence&&!r){toast('请选择原句。',true);return false}if(!d.corrected.trim()){toast('请输入修改后句子。',true);return false}if(arr(e.reviews).some(x=>x.key===d.key&&x.id!==r?.id)){toast('该原句已有批改，请编辑已有记录。',true);return false}return updateEssay(x=>{let item={...o,...d,id:r?.id||uid(),original:sentence?.text||o.original,created:r?.created||now(),mastered:!!o.mastered};x.reviews=r?arr(x.reviews).map(y=>y.id===r.id?item:y):[...arr(x.reviews),item];if(x.status!=='已完成')x.status=sentences.every(s=>x.reviews.some(r=>r.key===s.key&&norm(r.original)===norm(s.text)))?'已精批':'待批改'})},'review')}

document.addEventListener('change',async ev=>{let el=ev.target;try{if(el.id==='dailySource'||el.id==='dailyType'){await updateDaily({[el.id==='dailySource'?'source':'type']:el.value});return}if(el.id==='materialBatch'){materialUI.batch=el.value;if(el.value)materialUI.source='imported';materialUI.page=0;render();return}if(['materialSource','materialTask','materialSaved'].includes(el.id)){let k={materialSource:'source',materialTask:'task',materialSaved:'onlySaved'}[el.id];materialUI[k]=el.id==='materialSaved'?el.checked:el.value;materialUI.page=0;if(el.id==='materialSource'){materialUI.batch='';render()}else refreshMaterials();return}if(el.id==='materialFile'){await previewMaterialFile(el);return}if(el.id==='sourcescopefilter'){Object.assign(filter,{sourceScope:el.value,sourceKind:'all',sourceBook:'all',sourceTest:'all',sourceExact:'all'});render();return}if(el.id==='sourcekindfilter'){Object.assign(filter,{sourceKind:el.value,sourceBook:'all',sourceTest:'all',sourceExact:'all'});render();return}if(el.id==='sourcebookfilter'){filter.sourceBook=el.value;refreshResults();return}if(el.id==='sourcetestfilter'){filter.sourceTest=el.value;refreshResults();return}if(el.id==='sourceexactfilter'){filter.sourceExact=el.value;refreshResults();return}if(el.id==='taskfilter'){filter.task=el.value;filter.category='all';render();return}if(el.id==='catfilter'){filter.category=el.value;refreshResults();return}if(el.id==='statusfilter'){filter.status=el.value;refreshResults();return}if(!modal)return;if(['sourceKind','sourceBook','sourceTest'].includes(el.id)){modal.dirty=true;syncSourceEditor();return}if(el.name==='task'&&$('taskFields')){let o=modal.data||{};$('taskFields').innerHTML=taskFields(el.value,o);modal.dirty=true}if(el.id==='modelTextFile'){let f=el.files[0];if(!f)return;let owner=modal,area=$('editor').querySelector('textarea[name=content]');if(f.size>2*1024*1024){toast('文本文件超过 2 MB。',true);el.value='';return}if(!/\.(txt|md|markdown)$/i.test(f.name)){toast('请选择 TXT 或 Markdown 文件。',true);el.value='';return}if(area.value.trim()&&!confirm('导入文件将替换当前输入框中的范文正文，确定继续？')){el.value='';return}let text=await f.text();if(modal!==owner)return;area.value=text.replace(/^\uFEFF/,'');area.dispatchEvent(new Event('input',{bubbles:true}));el.value='';toast('已导入正文，请确认后保存。');return}if(el.id==='imageInput'){let files=[...el.files],owner=modal,saveButton=$('modalroot').querySelector('[data-action=save-modal]');if(saveButton)saveButton.disabled=true;try{for(let f of files){if(!/^image\/(png|jpeg|webp|gif|bmp|avif)$/i.test(f.type)){toast('不支持的图片格式：'+f.name,true);continue}if(f.size>8*1024*1024){toast('图片超过 8 MB，请先压缩：'+f.name,true);continue}let data=await readFile(f);if(modal!==owner||!modal?.images)return;modal.images.push({id:uid(),name:f.name,data});modal.dirty=true}$('editGallery').innerHTML=gallery(modal.images,true);el.value=''}finally{if(saveButton?.isConnected)saveButton.disabled=false}}if(el.hasAttribute('data-match')){let r=modal.data.rows[Number(el.dataset.match)];r.target=el.value;r.status=el.value?'manual':'review';drawImport()}if(el.id==='importOverall')modal.data.keepOverall=el.checked;if(el.id==='restoreFile'){let f=el.files[0];if(!f)return;$('confirmRestore').disabled=true;modal.data=null;try{let x=validateBackup(JSON.parse(await f.text()));modal.data=x;$('restorePreview').innerHTML=`<div class="notice">已识别 ${x.essays.length} 篇作文、${x.notes.length} 条笔记、${x.models.length} 篇范文。请核对后确认。</div>`;$('confirmRestore').disabled=false}catch(e){$('restorePreview').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}}catch(e){toast('操作失败：'+(e.message||e),true)}});
