:"mobility","cn":"流动性；出行能力（n.）","example":"Reliable transport improves mobility for people who cannot drive.","translation":"可靠的交通改善无法开车者的出行能力。","tip":"social mobility 与 physical mobility 语义不同","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/mobility"},{"id":"core-030","type":"学术词汇","en":"intervention","cn":"干预（n.）","example":"Early intervention can help pupils who struggle with reading.","translation":"早期干预可以帮助阅读困难的学生。","tip":"early intervention；government intervention","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/intervention"},{"id":"core-031","type":"学术词汇","en":"proportion","cn":"比例（n.）","example":"A large proportion of the budget was spent on housing.","translation":"预算中很大一部分用于住房。","tip":"a proportion of；与 percentage 区分","topic":"图表与数据","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/proportion"},{"id":"core-032","type":"学术词汇","en":"fluctuate","cn":"波动（v.）","example":"The number of visitors fluctuated throughout the year.","translation":"游客人数在全年波动。","tip":"fluctuate between A and B；名词 fluctuation","topic":"图表与数据","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/fluctuate"},{"id":"core-033","type":"学术词汇","en":"predominantly","cn":"主要地（adv.）","example":"The area was predominantly residential in 2000.","translation":"2000年该地区主要为住宅区。","tip":"修饰形容词或动词；不等于 exclusively","topic":"图表与数据","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/predominantly"},{"id":"core-034","type":"学术词汇","en":"marginal","cn":"微小的；边缘的（adj.）","example":"There was only a marginal increase in water consumption.","translation":"用水量仅略有增加。","tip":"a marginal increase；描述小幅变化","topic":"图表与数据","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/marginal"},{"id":"core-035","type":"学术词汇","en":"disproportionate","cn":"不成比例的（adj.）","example":"Rising energy prices may place a disproportionate burden on low-income families.","translation":"能源价格上涨可能给低收入家庭带来不成比例的负担。","tip":"a disproportionate burden on","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/disproportionate"},{"id":"core-036","type":"学术词汇","en":"indispensable","cn":"不可或缺的（adj.）","example":"Literacy is indispensable to effective participation in modern society.","translation":"读写能力对于有效参与现代社会不可或缺。","tip":"be indispensable to/for；绝对性较强，慎用","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/indispensable"},{"id":"core-037","type":"学术词汇","en":"affordable","cn":"负担得起的（adj.）","example":"Affordable childcare can help parents remain in employment.","translation":"可负担的托育服务可以帮助家长继续就业。","tip":"affordable housing / childcare；名词 affordability","topic":"家庭与儿童","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/affordable"},{"id":"core-038","type":"学术词汇","en":"accountability","cn":"问责；责任（n.）","example":"Transparent reporting can improve accountability in public institutions.","translation":"透明报告可以增强公共机构的问责。","tip":"ensure accountability；be accountable for","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/accountability"},{"id":"core-039","type":"学术词汇","en":"adapt","cn":"适应；调整（v.）","example":"Employees may need to adapt to changing technological requirements.","translation":"员工可能需要适应不断变化的技术要求。","tip":"adapt to sth.；adapt sth. for sth.","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/adapt"},{"id":"core-040","type":"学术词汇","en":"empirical","cn":"基于经验或实证的（adj.）","example":"Policy decisions should be informed by empirical evidence where available.","translation":"在条件允许时，政策决策应以实证证据为依据。","tip":"empirical evidence；不可虚构研究","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/dictionary/english/empirical"},{"id":"core-041","type":"短语与搭配","en":"pose a threat to","cn":"对……构成威胁","example":"Unchecked urban expansion may pose a threat to local wildlife.","translation":"不受控制的城市扩张可能威胁当地野生动物。","tip":"a threat to + 名词；pose a risk to 同类搭配","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-042","type":"短语与搭配","en":"strike a balance between A and B","cn":"在两者之间取得平衡","example":"Employers must strike a balance between productivity and employee well-being.","translation":"雇主必须在生产力和员工福祉之间取得平衡。","tip":"between 后的两项尽量保持语法平行","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-043","type":"短语与搭配","en":"play a pivotal role in","cn":"在……中发挥关键作用","example":"Teachers play a pivotal role in developing children's confidence.","translation":"教师在培养儿童自信方面发挥关键作用。","tip":"in + 名词或动名词；不必每次都用 pivotal","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-044","type":"短语与搭配","en":"address the root causes of","cn":"解决……的根本原因","example":"Effective housing policies should address the root causes of homelessness.","translation":"有效住房政策应处理无家可归问题的根本原因。","tip":"区别 address symptoms（处理表象）","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-045","type":"短语与搭配","en":"give rise to","cn":"引发；导致","example":"Poorly planned development can give rise to traffic problems.","translation":"规划不当的开发可能引发交通问题。","tip":"后接结果；通常避免后接完整从句","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-046","type":"短语与搭配","en":"have access to","cn":"能够获取；有机会使用","example":"All children should have access to quality education.","translation":"所有儿童都应有机会接受优质教育。","tip":"access 此处不可数；to 是介词","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-047","type":"短语与搭配","en":"equip someone with skills","cn":"使某人具备技能","example":"Vocational training equips young people with practical skills.","translation":"职业培训使年轻人具备实用技能。","tip":"equip sb. with sth.；不要省略 with","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-048","type":"短语与搭配","en":"raise public awareness of","cn":"提高公众对……的认识","example":"Public campaigns can raise public awareness of food waste.","translation":"公益宣传可以提高公众对食物浪费的认识。","tip":"awareness of；也可用 raise awareness about","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-049","type":"短语与搭配","en":"bridge the gap between","cn":"缩小……之间的差距","example":"Community libraries can help bridge the gap between rich and poor households.","translation":"社区图书馆有助于缩小贫富家庭的差距。","tip":"bridge the gap between A and B","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-050","type":"短语与搭配","en":"place a burden on","cn":"给……带来负担","example":"High rents place a financial burden on young workers.","translation":"高房租给年轻劳动者带来经济负担。","tip":"a financial / emotional burden on","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-051","type":"短语与搭配","en":"make informed decisions","cn":"作出知情决策","example":"Consumers need clear information to make informed decisions.","translation":"消费者需要清晰信息来作出知情决策。","tip":"informed 表示掌握相关信息，而非单纯明智","topic":"媒体与广告","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-052","type":"短语与搭配","en":"impose restrictions on","cn":"对……施加限制","example":"Cities may impose restrictions on private vehicles in congested areas.","translation":"城市可能对拥堵区域的私家车施加限制。","tip":"impose restrictions on；名词 restriction","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-053","type":"短语与搭配","en":"comply with regulations","cn":"遵守法规","example":"Businesses should comply with environmental regulations.","translation":"企业应遵守环境法规。","tip":"comply with；不要写 comply to","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-054","type":"短语与搭配","en":"contribute to economic growth","cn":"促进经济增长","example":"Investment in infrastructure can contribute to economic growth.","translation":"基础设施投资可以促进经济增长。","tip":"contribute to + 名词或动名词；也可用于负面结果","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-055","type":"短语与搭配","en":"provide someone with something","cn":"为某人提供某物","example":"Schools should provide pupils with opportunities to explore their interests.","translation":"学校应为学生提供探索兴趣的机会。","tip":"provide sth. for sb. 也是正确结构","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-056","type":"短语与搭配","en":"take precedence over","cn":"优先于……","example":"Public safety should take precedence over short-term profits.","translation":"公共安全应优先于短期利润。","tip":"take precedence over；慎用绝对性判断","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-057","type":"短语与搭配","en":"rely heavily on","cn":"严重依赖；高度依赖","example":"Rural communities may rely heavily on private cars.","translation":"乡村社区可能高度依赖私家车。","tip":"rely on；副词 heavily 修饰依赖程度","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-058","type":"短语与搭配","en":"reduce reliance on","cn":"减少对……的依赖","example":"Solar panels can reduce household reliance on fossil fuels.","translation":"太阳能板可以减少家庭对化石燃料的依赖。","tip":"reliance on；rely 的名词形式","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-059","type":"短语与搭配","en":"a catalyst for","cn":"……的推动因素","example":"Affordable internet access can be a catalyst for innovation.","translation":"可负担的互联网接入可以成为创新的推动因素。","tip":"serve as / act as a catalyst for","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-060","type":"短语与搭配","en":"meet the needs of","cn":"满足……的需求","example":"Urban design should meet the needs of older residents.","translation":"城市设计应满足老年居民的需求。","tip":"meet needs；不要写 satisfy the needs 不自然并非错误","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-061","type":"短语与搭配","en":"widen the income gap","cn":"扩大收入差距","example":"Unequal access to training may widen the income gap.","translation":"培训机会不均可能扩大收入差距。","tip":"widen / narrow the gap；与 inequality 搭配","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-062","type":"短语与搭配","en":"promote equal opportunities","cn":"促进机会平等","example":"Scholarships can promote equal opportunities for students from disadvantaged backgrounds.","translation":"奖学金可以促进弱势背景学生的机会平等。","tip":"opportunities for sb. / to do sth.","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-063","type":"短语与搭配","en":"a sense of belonging","cn":"归属感","example":"Community activities can foster a sense of belonging among newcomers.","translation":"社区活动可以培养新来者的归属感。","tip":"foster / develop a sense of belonging","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-064","type":"短语与搭配","en":"hold someone accountable for","cn":"使某人对……负责","example":"Companies should be held accountable for misleading environmental claims.","translation":"企业应为误导性的环保声明承担责任。","tip":"常见被动形式 be held accountable for","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-065","type":"短语与搭配","en":"pave the way for","cn":"为……铺平道路","example":"Better digital infrastructure may pave the way for new forms of employment.","translation":"更好的数字基础设施可能为新就业形式铺平道路。","tip":"for 后接名词或动名词","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-066","type":"短语与搭配","en":"at the expense of","cn":"以牺牲……为代价","example":"Economic growth should not come at the expense of environmental protection.","translation":"经济增长不应以牺牲环境保护为代价。","tip":"at the expense of；突出代价关系","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-067","type":"短语与搭配","en":"be associated with","cn":"与……有关联","example":"Physical inactivity is associated with a range of health problems.","translation":"缺乏运动与多种健康问题有关。","tip":"表示关联，不直接证明因果","topic":"健康与医疗","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-068","type":"短语与搭配","en":"implement effective measures","cn":"实施有效措施","example":"Local authorities should implement effective measures to reduce road accidents.","translation":"地方政府应实施有效措施减少道路事故。","tip":"implement measures / policies；说明措施具体是什么","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-069","type":"短语与搭配","en":"achieve long-term benefits","cn":"获得长期收益","example":"Early investment in education may achieve long-term benefits for society.","translation":"早期教育投资可能给社会带来长期收益。","tip":"long-term 作前置定语要连字符","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-070","type":"短语与搭配","en":"curb the spread of","cn":"遏制……的传播","example":"Media literacy may help curb the spread of misinformation.","translation":"媒体素养可能有助于遏制错误信息传播。","tip":"curb the spread of / curb emissions","topic":"媒体与广告","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-071","type":"短语与搭配","en":"ease pressure on","cn":"减轻……的压力","example":"Preventive healthcare can ease pressure on hospitals.","translation":"预防性医疗可以减轻医院压力。","tip":"ease pressure on；亦可用 relieve pressure on","topic":"健康与医疗","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-072","type":"短语与搭配","en":"preserve cultural heritage","cn":"保护文化遗产","example":"Museums play an important role in preserving cultural heritage.","translation":"博物馆在保护文化遗产方面发挥重要作用。","tip":"heritage 通常不可数","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-073","type":"短语与搭配","en":"adapt to changing circumstances","cn":"适应变化的环境","example":"Lifelong learning helps workers adapt to changing circumstances.","translation":"终身学习帮助劳动者适应变化的环境。","tip":"adapt to；circumstances 常用复数","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-074","type":"短语与搭配","en":"make efficient use of","cn":"高效利用","example":"Compact housing can make efficient use of limited urban land.","translation":"紧凑型住房可以高效利用有限城市土地。","tip":"make use of；efficient 强调投入产出","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://dictionary.cambridge.org/"},{"id":"core-075","type":"句式与语法","en":"Although A, B.","cn":"尽管A，但B（让步）","example":"Although remote working offers flexibility, it can also reduce informal interaction among colleagues.","translation":"尽管远程办公提供灵活性，但也可能减少同事间的非正式互动。","tip":"although 与 but 不在同一连接关系中重复使用","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-076","type":"句式与语法","en":"While A, B.","cn":"虽然A，但B（对比）","example":"While some students thrive in competitive environments, others benefit from cooperative learning.","translation":"一些学生在竞争环境中表现出色，另一些则从合作学习中获益。","tip":"while 可引出对比；确保语义清楚","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-077","type":"句式与语法","en":"It is not so much A as B.","cn":"与其说是A，不如说是B。","example":"The main obstacle is not so much a lack of technology as a lack of training.","translation":"主要障碍与其说是技术不足，不如说是培训不足。","tip":"A、B 使用平行结构","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-078","type":"句式与语法","en":"The extent to which A depends on B.","cn":"A的程度取决于B。","example":"The extent to which online learning is effective depends on the quality of instruction.","translation":"在线学习的有效程度取决于教学质量。","tip":"主语是 the extent，谓语用单数 depends","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-079","type":"句式与语法","en":"One reason why A is that B.","cn":"A的一个原因是B。","example":"One reason why people avoid public transport is that services are unreliable.","translation":"人们不愿使用公共交通的一个原因是服务不可靠。","tip":"reason ... is that；不必再加 because","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-080","type":"句式与语法","en":"By doing A, S can do B.","cn":"通过A，主语可以实现B。","example":"By improving bus services, cities can reduce dependence on private cars.","translation":"通过改善公交服务，城市可以减少对私家车的依赖。","tip":"by 后接动名词；逻辑主语要一致","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-081","type":"句式与语法","en":"Rather than doing A, S should do B.","cn":"与其做A，不如做B。","example":"Rather than banning smartphones outright, schools should teach responsible use.","translation":"学校与其完全禁止智能手机，不如教授负责任的使用方法。","tip":"rather than 后可用动名词；对比行动","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-082","type":"句式与语法","en":"This is particularly true of ...","cn":"对于……尤其如此。","example":"This is particularly true of families living in remote rural areas.","translation":"对于住在偏远农村地区的家庭尤其如此。","tip":"承接上文观点，不能孤立充当论据","topic":"逻辑与论证","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-083","type":"句式与语法","en":"A may partly be attributed to B.","cn":"A部分可归因于B。","example":"The decline in local shop visits may partly be attributed to the growth of online shopping.","translation":"本地商店客流下降可能部分归因于网购增长。","tip":"attribute A to B；不要把相关性当作因果证明","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-084","type":"句式与语法","en":"Not only does A ..., but it also ...","cn":"A不仅……而且……","example":"Not only does regular exercise improve physical health, but it also helps people manage stress.","translation":"规律运动不仅改善身体健康，也帮助人们管理压力。","tip":"not only 前置需倒装；保持主语明确","topic":"健康与医疗","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-085","type":"句式与语法","en":"Unless A, B may ...","cn":"除非A，否则B可能……","example":"Unless cities improve public transport, congestion may continue to worsen.","translation":"除非城市改善公共交通，否则拥堵可能继续恶化。","tip":"unless 相当于 if not；避免多余否定","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-086","type":"句式与语法","en":"If A were to ..., B could ...","cn":"如果A……，B可能……","example":"If governments were to subsidise home insulation, energy demand could fall.","translation":"如果政府补贴住宅保温，能源需求可能下降。","tip":"用于假设情景；不是实际预测","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-087","type":"句式与语法","en":"The more A, the more B.","cn":"越……就越……","example":"The more accessible training is, the more likely workers are to acquire new skills.","translation":"培训越容易获取，劳动者就越有可能掌握新技能。","tip":"两个比较结构需各自完整","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-088","type":"句式与语法","en":"Whether A or B depends largely on C.","cn":"究竟A还是B，很大程度取决于C。","example":"Whether a policy succeeds or fails depends largely on how it is implemented.","translation":"一项政策成败很大程度取决于实施方式。","tip":"whether 引导主语从句；depends 单数","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-089","type":"句式与语法","en":"What matters most is ...","cn":"最重要的是……","example":"What matters most is whether students can apply what they have learned.","translation":"最重要的是学生能否应用所学知识。","tip":"what 从句作主语；避免空泛强调","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-090","type":"句式与语法","en":"To the extent that A, B.","cn":"在A成立的程度上，B。","example":"To the extent that public transport is reliable, higher parking charges may encourage people to drive less.","translation":"在公共交通可靠的前提程度内，更高停车费可能鼓励人们少开车。","tip":"用于限定论断；通常比简单 if 更正式","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-091","type":"句式与语法","en":"A does not necessarily mean that B.","cn":"A并不必然意味着B。","example":"Greater access to information does not necessarily mean that people are better informed.","translation":"更多信息获取渠道并不必然意味着人们更了解情况。","tip":"用于反驳过度推论","topic":"媒体与广告","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-092","type":"句式与语法","en":"Given that A, B.","cn":"考虑到A，B。","example":"Given that housing costs are high, many graduates choose to live with their parents.","translation":"考虑到住房成本较高，许多毕业生选择与父母同住。","tip":"given that 后接完整从句；注意假设依据","topic":"家庭与儿童","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-093","type":"句式与语法","en":"A is more likely to ... if B.","cn":"如果B，A更有可能……","example":"Children are more likely to read regularly if books are readily available at home.","translation":"如果家中容易获得书籍，儿童更有可能经常阅读。","tip":"用于概率判断，不表必然","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-094","type":"句式与语法","en":"It would be misleading to assume that ...","cn":"假定……可能具有误导性。","example":"It would be misleading to assume that all older people struggle with technology.","translation":"假定所有老年人都难以使用科技可能具有误导性。","tip":"适合质疑一概而论的观点","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-095","type":"句式与语法","en":"A alone is unlikely to be sufficient to B.","cn":"仅靠A可能不足以实现B。","example":"Higher taxes alone are unlikely to be sufficient to reduce plastic waste.","translation":"仅靠提高税收可能不足以减少塑料垃圾。","tip":"alone 强调单一手段；具体说明配套措施","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-096","type":"句式与语法","en":"Rather than viewing A as B, we can see it as C.","cn":"与其把A视作B，不如视作C。","example":"Rather than viewing vocational education as a fallback option, we can see it as a valuable route into employment.","translation":"与其把职业教育看作退路，不如视为有价值的就业途径。","tip":"as 后接名词或名词短语","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-097","type":"句式与语法","en":"A is a necessary but not sufficient condition for B.","cn":"A是B的必要但非充分条件。","example":"Access to technology is a necessary but not sufficient condition for effective online learning in many contexts.","translation":"在许多情境中，技术可及性是有效在线学习的必要但非充分条件。","tip":"适用于限定因果；注意必要性不能随意断言","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-098","type":"句式与语法","en":"Even if A, B may still ...","cn":"即使A，B仍可能……","example":"Even if public transport is free, people may still drive if services are infrequent.","translation":"即使公交免费，如果班次少，人们仍可能开车。","tip":"even if 表假设；even though 常表事实让步","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://www.phrasebank.manchester.ac.uk/"},{"id":"core-099","type":"作文佳句","en":"A well-designed education system should cultivate curiosity as well as impart knowledge.","cn":"设计良好的教育体系既应传授知识，也应培养好奇心。","example":"A well-designed training programme should develop practical skills as well as theoretical understanding.","translation":"设计良好的培训计划既应培养实践技能，也应发展理论理解。","tip":"as well as 连接并列内容","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-100","type":"作文佳句","en":"The benefits of technological innovation are not always distributed evenly across society.","cn":"技术创新的益处并不总是均匀分布于社会各群体。","example":"The benefits of economic growth are not always distributed evenly across regions.","translation":"经济增长的益处并不总是均匀分布在各地区。","tip":"be distributed evenly across；用于讨论公平","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-101","type":"作文佳句","en":"Environmental policies are more likely to gain public support when their costs and benefits are clearly explained.","cn":"当政策成本和收益得到清晰解释时，环保政策更可能获得公众支持。","example":"Transport reforms are more likely to gain public support when their objectives are clearly communicated.","translation":"交通改革目标得到清楚传达时，更可能获得公众支持。","tip":"gain public support；避免无条件保证","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-102","type":"作文佳句","en":"Preventing illness can be just as important as treating it.","cn":"预防疾病可以与治疗疾病同样重要。","example":"Preventing crime can be just as important as punishing offenders.","translation":"预防犯罪可以与惩罚违法者同样重要。","tip":"just as important as；两项形式平行","topic":"健康与医疗","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-103","type":"作文佳句","en":"The effectiveness of a policy depends not only on its design but also on its implementation.","cn":"政策成效不仅取决于设计，也取决于实施。","example":"The success of an educational reform depends not only on its objectives but also on teacher training.","translation":"教育改革成效不仅取决于目标，还取决于教师培训。","tip":"not only ... but also；平行结构","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-104","type":"作文佳句","en":"Access to information is of limited value if people lack the skills to evaluate it critically.","cn":"如果人们缺乏批判性评估能力，获取信息的价值就有限。","example":"Access to digital tools is of limited value if students lack guidance on how to use them.","translation":"如果学生缺乏使用指导，数字工具的可及性就价值有限。","tip":"be of limited value；条件限定","topic":"媒体与广告","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-105","type":"作文佳句","en":"Economic incentives are most effective when people have realistic alternatives.","cn":"当人们拥有现实可行的替代选择时，经济激励最有效。","example":"Parking charges may be more effective when commuters have reliable transport alternatives.","translation":"通勤者有可靠替代交通方式时，停车收费可能更有效。","tip":"实际论证时避免无依据使用最高级","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-106","type":"作文佳句","en":"Public spaces provide opportunities for interaction that might not otherwise occur.","cn":"公共空间提供了原本可能不会发生的交流机会。","example":"Community centres create opportunities for social interaction that might not otherwise occur.","translation":"社区中心创造了原本可能不会发生的社会交流机会。","tip":"otherwise 表示若非如此","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-107","type":"作文佳句","en":"A narrow focus on short-term results can come at the expense of long-term development.","cn":"狭隘关注短期结果可能以长期发展为代价。","example":"A narrow focus on exam scores can come at the expense of deeper understanding.","translation":"狭隘关注考试成绩可能以深入理解为代价。","tip":"a narrow focus on；at the expense of","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-108","type":"作文佳句","en":"The same policy may produce different outcomes in different social contexts.","cn":"同一政策在不同社会情境中可能产生不同结果。","example":"The same teaching method may produce different outcomes in different classrooms.","translation":"同一教学方法在不同课堂可能产生不同结果。","tip":"produce outcomes；适合讨论情境差异","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-109","type":"作文佳句","en":"A lack of reliable public transport can restrict access to employment and essential services.","cn":"缺乏可靠公共交通可能限制就业及基本服务的可及性。","example":"A lack of affordable internet access can restrict access to online education.","translation":"缺乏可负担的互联网可能限制在线教育机会。","tip":"a lack of；restrict access to","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-110","type":"作文佳句","en":"The convenience of online shopping needs to be weighed against its potential environmental costs.","cn":"网购的便利性需要与潜在环境成本一起权衡。","example":"The benefits of air travel need to be weighed against its environmental impact.","translation":"航空旅行的益处需要与其环境影响一起权衡。","tip":"weigh A against B；被动形式也常用","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-111","type":"作文佳句","en":"Flexible working can improve employees' quality of life, provided that workloads remain manageable.","cn":"只要工作量仍可管理，灵活工作就可能改善员工生活质量。","example":"Online learning can be effective, provided that learners receive adequate support.","translation":"只要学习者获得充分支持，在线学习就可能有效。","tip":"provided that 表条件","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-112","type":"作文佳句","en":"Cultural traditions can evolve without losing their essential meaning.","cn":"文化传统可以在不失去核心意义的情况下演变。","example":"Local festivals can adapt to modern lifestyles without losing their distinctive character.","translation":"地方节庆可以适应现代生活而不失去其独特性。","tip":"without + 动名词","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-113","type":"作文佳句","en":"Parents cannot be expected to shoulder the entire responsibility for children's education.","cn":"不能指望父母独自承担儿童教育的全部责任。","example":"Individuals cannot be expected to shoulder the entire responsibility for reducing emissions.","translation":"不能指望个人独自承担减排的全部责任。","tip":"shoulder responsibility；讨论多方角色","topic":"家庭与儿童","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-114","type":"作文佳句","en":"Efforts to reduce waste should focus on prevention rather than disposal alone.","cn":"减少垃圾的努力应着重预防，而非仅着眼于处理。","example":"Efforts to reduce illness should focus on prevention rather than treatment alone.","translation":"减少疾病的努力应着重预防，而非仅依赖治疗。","tip":"efforts to do sth.；focus on","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-115","type":"作文佳句","en":"A diverse workforce can bring together a wider range of perspectives and experiences.","cn":"多元化劳动力可以汇聚更广泛的观点和经验。","example":"A diverse classroom can expose students to a wider range of perspectives.","translation":"多元化课堂可以让学生接触更广泛的观点。","tip":"a wider range of；can 表可能性","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-116","type":"作文佳句","en":"The value of education extends beyond its contribution to the labour market.","cn":"教育的价值超越其对劳动力市场的贡献。","example":"The value of public parks extends beyond their environmental benefits.","translation":"公共公园的价值不止其环境益处。","tip":"extend beyond；适合拓宽论点","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-117","type":"作文佳句","en":"Raising awareness is a useful first step, but it must be accompanied by practical action.","cn":"提高意识是有用的第一步，但必须伴随实际行动。","example":"Providing information is a useful first step, but it should be accompanied by clear guidance.","translation":"提供信息是有用的第一步，但应伴随清晰指导。","tip":"be accompanied by；用具体行动支撑观点","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-118","type":"作文佳句","en":"Greater efficiency does not automatically translate into improved well-being.","cn":"效率提高并不会自动转化为福祉改善。","example":"Higher income does not automatically translate into greater life satisfaction.","translation":"更高收入不会自动转化为更高生活满意度。","tip":"translate into 表转化为结果","topic":"工作与经济","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-119","type":"作文佳句","en":"Restrictions can be justified when they protect others from significant harm.","cn":"当限制措施保护他人免受严重伤害时，它们可能有正当理由。","example":"Safety regulations can be justified when they reduce foreseeable risks.","translation":"当安全法规降低可预见风险时，可能具有正当理由。","tip":"be justified when；承认限制条件","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-120","type":"作文佳句","en":"The quality of urban life depends in part on how easily residents can reach essential services.","cn":"城市生活质量部分取决于居民能否便捷到达基本服务设施。","example":"The quality of rural life depends in part on the availability of essential services.","translation":"乡村生活质量部分取决于基本服务的可及性。","tip":"in part 避免将复杂现象归于单一原因","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-121","type":"Task 1 图表","en":"rise from A to B","cn":"从A上升至B","example":"The figure rose from 20% to 35% between 2010 and 2020.","translation":"该数值在2010至2020年间从20%上升至35%。","tip":"from 起点，to 终点；示例为虚构数据","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-122","type":"Task 1 图表","en":"rise by X percentage points","cn":"上升X个百分点","example":"The share of cyclists rose by 15 percentage points, from 20% to 35%.","translation":"骑行者占比从20%升至35%，增加15个百分点。","tip":"百分点与相对百分比不同","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-123","type":"Task 1 图表","en":"fall to a low of","cn":"降至最低值……","example":"The unemployment rate fell to a low of 4% in June.","translation":"失业率在六月降至4%的最低点。","tip":"仅在图中确实最低时使用","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-124","type":"Task 1 图表","en":"reach a peak of","cn":"达到……的峰值","example":"Visitor numbers reached a peak of 80,000 in August.","translation":"游客人数在八月达到八万的峰值。","tip":"peak at + 数值也可；数据为示例","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-125","type":"Task 1 图表","en":"remain relatively stable","cn":"保持相对稳定","example":"Electricity consumption remained relatively stable throughout the period.","translation":"用电量在整个期间保持相对稳定。","tip":"允许小幅波动；不要用于明显起伏","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-126","type":"Task 1 图表","en":"level off at","cn":"趋于稳定在……","example":"After a rapid rise, the figure levelled off at around 60%.","translation":"快速增长后，该数值趋于稳定在约60%。","tip":"levelled 为英式拼写；at 后接数值","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-127","type":"Task 1 图表","en":"fluctuate between A and B","cn":"在A与B之间波动","example":"Monthly sales fluctuated between 2,000 and 3,000 units.","translation":"月销量在2000至3000件之间波动。","tip":"between ... and；避免写 fluctuate from ... to 表范围","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-128","type":"Task 1 图表","en":"experience a marked decline","cn":"出现显著下降","example":"The number of households without internet access experienced a marked decline.","translation":"没有互联网接入的家庭数量显著下降。","tip":"也可直接用 declined markedly，更简洁","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-129","type":"Task 1 图表","en":"show an upward trend","cn":"呈现上升趋势","example":"The proportion of renewable energy showed an upward trend overall.","translation":"可再生能源占比总体呈上升趋势。","tip":"overall 允许中途下降；具体取决于图表","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-130","type":"Task 1 图表","en":"overtake","cn":"超过；赶超","example":"Rail travel overtook bus travel in 2015.","translation":"铁路出行在2015年超过公交出行。","tip":"仅用于发生相对排名逆转时","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-131","type":"Task 1 图表","en":"account for the largest share","cn":"占最大份额","example":"Housing accounted for the largest share of household expenditure.","translation":"住房占家庭支出的最大份额。","tip":"account for + 比例或份额","topic":"占比","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-132","type":"Task 1 图表","en":"make up approximately one third of","cn":"约占……三分之一","example":"Transport made up approximately one third of total expenditure.","translation":"交通约占总支出的三分之一。","tip":"approximately 用于近似；注意分数","topic":"占比","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-133","type":"Task 1 图表","en":"twice as high as","cn":"是……的两倍","example":"The figure for France was twice as high as that for Spain.","translation":"法国的数值是西班牙的两倍。","tip":"比较倍数时使用 twice as ... as","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-134","type":"Task 1 图表","en":"exceed A by B","cn":"比A多B","example":"The number of male participants exceeded that of female participants by 200.","translation":"男性参与者人数比女性多200人。","tip":"that of 替代单数名词；by 表差值","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-135","type":"Task 1 图表","en":"the gap narrowed","cn":"差距缩小","example":"The gap between the two figures narrowed towards the end of the period.","translation":"两项数值的差距在期末趋于缩小。","tip":"需要至少两个时间点；不能仅据终值","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-136","type":"Task 1 图表","en":"respectively","cn":"分别地","example":"The figures for buses and trains were 25% and 40%, respectively.","translation":"公交和铁路的数值分别为25%和40%。","tip":"数值顺序须与列举对象一致","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-137","type":"Task 1 图表","en":"in contrast to","cn":"与……形成对比","example":"In contrast to oil consumption, gas consumption increased steadily.","translation":"与石油消费不同，天然气消费稳步增加。","tip":"to 后接名词；勿添加主观原因","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-138","type":"Task 1 图表","en":"by far the most popular","cn":"远远最受欢迎的","example":"Cars were by far the most popular mode of transport.","translation":"汽车是远远最受欢迎的交通方式。","tip":"仅在领先幅度明显且数据表示选择时使用","topic":"比较","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-139","type":"Task 1 图表","en":"roughly half of","cn":"约一半","example":"Roughly half of the respondents chose public transport.","translation":"约一半受访者选择公共交通。","tip":"roughly / around / approximately 可选用","topic":"占比","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-140","type":"Task 1 图表","en":"a negligible change","cn":"可忽略的变化","example":"There was a negligible change in the figure for coal.","translation":"煤炭数值的变化微乎其微。","tip":"仅用于非常小的变化；避免夸大","topic":"趋势","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-141","type":"Task 1 图表","en":"be converted into","cn":"被改建为；转化为","example":"The former factory was converted into a shopping centre.","translation":"原工厂被改建为购物中心。","tip":"地图改造常用被动语态","topic":"地图","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-142","type":"Task 1 图表","en":"be replaced by","cn":"被……替代","example":"The car park was replaced by a public garden.","translation":"停车场被公共花园取代。","tip":"A was replaced by B；注意方向","topic":"地图","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-143","type":"Task 1 图表","en":"be located to the north of","cn":"位于……北面","example":"The new library is located to the north of the main entrance.","translation":"新图书馆位于主入口北侧。","tip":"to the north of 表相对位置；以地图方向为准","topic":"地图","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-144","type":"Task 1 图表","en":"remain unchanged","cn":"保持不变","example":"The road network remained unchanged over the period.","translation":"道路网络在这段期间保持不变。","tip":"仅描述地图显示的信息","topic":"地图","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-145","type":"Task 1 图表","en":"be linked by","cn":"通过……连接","example":"The two residential areas are linked by a pedestrian path.","translation":"两个住宅区通过步行道相连。","tip":"by 后接连接设施；时态依据图示","topic":"地图","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-146","type":"Task 1 图表","en":"undergo significant redevelopment","cn":"经历显著重建","example":"The town centre underwent significant redevelopment between the two dates.","translation":"在两个日期之间，市中心经历了显著重建。","tip":"undergo 过去式 underwent","topic":"地图","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-147","type":"Task 1 图表","en":"the process begins with","cn":"流程始于……","example":"The process begins with the collection of used plastic bottles.","translation":"流程从收集使用过的塑料瓶开始。","tip":"with 后接名词或动名词","topic":"流程","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-148","type":"Task 1 图表","en":"be subsequently transferred to","cn":"随后被转移至……","example":"The mixture is subsequently transferred to a storage tank.","translation":"混合物随后被转移至储存罐。","tip":"自然流程常用主动；人工流程常用被动","topic":"流程","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-149","type":"Task 1 图表","en":"once A has been completed, B","cn":"A完成后，进行B","example":"Once the drying stage has been completed, the material is packaged.","translation":"干燥阶段完成后，材料被包装。","tip":"once 从句描述顺序；不添加未显示步骤","topic":"流程","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-150","type":"Task 1 图表","en":"culminate in","cn":"最终以……告终","example":"The process culminates in the production of finished paper sheets.","translation":"该流程最终产出成品纸张。","tip":"in 后接名词；简单表达 ends with 也可","topic":"流程","task":"Task 1","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://takeielts.britishcouncil.org/prepare/writing"},{"id":"core-151","type":"Task 2 论证","en":"Education: social mobility","cn":"教育与社会流动","example":"Affordable education → qualifications → wider employment opportunities → potential upward mobility.","translation":"可负担的教育→资格与技能→更多就业机会→可能向上流动。","tip":"限制：就业机会、地区资源也影响结果","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-152","type":"Task 2 论证","en":"Education: practical skills","cn":"教育与实践技能","example":"Work placements → application of knowledge → greater workplace readiness.","translation":"实习→运用知识→更好地适应工作。","tip":"不要否定理论知识；可讨论两者互补","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-153","type":"Task 2 论证","en":"Education: critical thinking","cn":"教育与批判性思维","example":"Open-ended discussion → evaluation of evidence → independent judgement.","translation":"开放讨论→评估证据→独立判断。","tip":"前提：教师提供适当指导","topic":"教育","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-154","type":"Task 2 论证","en":"Technology: digital divide","cn":"技术与数字鸿沟","example":"Unequal access to devices and connectivity → unequal learning opportunities → wider educational disparities.","translation":"设备和网络获取不均→学习机会不均→教育差距扩大。","tip":"同时考虑数字技能、学习支持","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-155","type":"Task 2 论证","en":"Technology: automation","cn":"自动化与就业转型","example":"Routine tasks become automated → demand shifts towards different skills → retraining becomes important.","translation":"常规任务自动化→技能需求改变→再培训重要性提高。","tip":"避免断言所有职业都会消失","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-156","type":"Task 2 论证","en":"Technology: privacy","cn":"技术与隐私","example":"Extensive data collection → greater potential for misuse → need for safeguards and accountability.","translation":"广泛收集数据→潜在滥用风险上升→需要保障和问责。","tip":"区分合理的数据使用与滥用","topic":"科技","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-157","type":"Task 2 论证","en":"Environment: public transport","cn":"环境与公共交通","example":"Reliable alternatives to driving → fewer private car trips → potentially lower transport emissions.","translation":"可靠替代出行→私家车出行减少→交通排放可能下降。","tip":"效果取决于客流、能源结构和服务质量","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-158","type":"Task 2 论证","en":"Environment: waste prevention","cn":"环境与源头减量","example":"Durable products and repair services → longer product lifespans → less demand for new materials.","translation":"耐用产品与维修服务→产品寿命延长→新材料需求减少。","tip":"考虑购买成本与维修可及性","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-159","type":"Task 2 论证","en":"Environment: carbon pricing","cn":"环境与碳定价","example":"Higher cost of carbon-intensive activities → incentive to adopt cleaner alternatives → potential emission reductions.","translation":"高碳活动成本增加→采用清洁替代方案的激励→可能减排。","tip":"注意低收入群体负担及补偿措施","topic":"环境","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-160","type":"Task 2 论证","en":"Government: prevention","cn":"政府支出与预防","example":"Early support for vulnerable groups → fewer avoidable crises → potentially lower demand for emergency services.","translation":"弱势群体早期支持→减少可避免危机→可能降低紧急服务需求。","tip":"需要说明具体项目；不能保证财政节省","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-161","type":"Task 2 论证","en":"Government: targeted subsidies","cn":"政府与定向补贴","example":"Targeted financial assistance → reduced barriers for low-income households → improved access to essential services.","translation":"定向资助→降低低收入家庭门槛→改善基本服务可及性。","tip":"考虑资格审核和遗漏人群","topic":"政府与公共政策","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-162","type":"Task 2 论证","en":"Health: active transport","cn":"健康与主动出行","example":"Safe walking and cycling infrastructure → more opportunities for daily activity → potential health benefits.","translation":"安全步行骑行设施→更多日常活动机会→潜在健康收益。","tip":"不忽视残障、天气与距离因素","topic":"健康与医疗","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-163","type":"Task 2 论证","en":"Health: food literacy","cn":"健康与食品素养","example":"Clear food information and education → informed choices → potential improvement in dietary habits.","translation":"清晰食品信息及教育→知情选择→饮食习惯可能改善。","tip":"价格和食物供应也影响选择","topic":"健康与医疗","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparatio elts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-169","type":"Task 2 论证","en":"Media: advertising to children","cn":"儿童与广告","example":"Limited ability to recognise persuasive intent → vulnerability to marketing → rationale for age-appropriate protections.","translation":"识别说服意图能力有限→易受营销影响→有理由采取适龄保护。","tip":"避免假定所有儿童或广告相同","topic":"媒体与广告","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-170","type":"Task 2 论证","en":"Crime: rehabilitation","cn":"犯罪与改造","example":"Education and skills training in custody → improved employment prospects after release → possible reduction in reoffending.","translation":"服刑期间教育培训→获释后就业前景改善→再犯可能减少。","tip":"效果依赖个体情况和社会支持；勿虚构数据","topic":"犯罪与法律","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-171","type":"Task 2 论证","en":"Transport: congestion","cn":"交通拥堵","example":"Frequent, affordable bus services → attractive alternative to driving → potentially fewer car journeys.","translation":"频繁且可负担的公交→开车的有吸引力替代方式→汽车出行可能减少。","tip":"结合停车、换乘、步行设施讨论","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-172","type":"Task 2 论证","en":"Transport: mixed-use planning","cn":"城市混合用地","example":"Homes near shops and services → shorter journeys → more feasible walking and cycling.","translation":"住宅靠近商店与服务→出行距离缩短→步行骑行更可行。","tip":"仍需考虑住房价格和道路安全","topic":"交通与城市","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-173","type":"Task 2 论证","en":"Family: childcare","cn":"家庭与托育","example":"Affordable childcare → lower barriers to paid work → wider choices for caregivers.","translation":"可负担托育→降低带薪就业门槛→照护者选择更多。","tip":"关注托育质量和家庭偏好","topic":"家庭与儿童","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-174","type":"Task 2 论证","en":"Culture: heritage preservation","cn":"文化与遗产保护","example":"Preserving local heritage → opportunities for learning and tourism → stronger understanding of local history.","translation":"保护地方遗产→学习与旅游机会→加深对地方历史的理解。","tip":"旅游收益不能保证；考虑维护成本","topic":"社会与文化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-175","type":"Task 2 论证","en":"Tourism: seasonal employment","cn":"旅游与季节性就业","example":"Seasonal visitor demand → temporary jobs → potentially unstable household income.","translation":"季节性游客需求→临时工作→家庭收入可能不稳定。","tip":"考虑旅游多元化与技能培训","topic":"旅游与全球化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-176","type":"Task 2 论证","en":"Globalisation: cultural exchange","cn":"全球化与文化交流","example":"Greater interaction across borders → exposure to different perspectives → opportunities for intercultural understanding.","translation":"跨国互动增多→接触不同观点→跨文化理解机会增加。","tip":"交流不必然减少偏见；关注质量","topic":"旅游与全球化","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"},{"id":"core-177","type":"Task 2 论证","en":"Animals: habitat protection","cn":"动物与栖息地保护","example":"Habitat conservation → preservation of breeding and feeding areas → support for biodiversity.","translation":"栖息地保护→保存繁殖和觅食区域→支持生物多样性。","tip":"保护措施需适合具体生态系统","topic":"动物与伦理","task":"Task 2","source":"原创整理 · 参考学习资源（非逐条核验）","url":"https://ielts.org/take-a-test/preparation-resources/writing-test-resources/"}];

let materialUI={q:'',type:'all',source:'all',task:'all',page:0,onlySaved:false,batch:''};
let dailyBusy=false, dailyMemory={};
function cleanMaterial(v,max=4000){return typeof v==='string'?v.trim().slice(0,max):''}
function materialKey(x){return String(x.en||'').trim().toLowerCase().replace(/\s+/g,' ')}
function materialHash(s){let n=2166136261;for(let i=0;i<s.length;i++){n^=s.charCodeAt(i);n=Math.imul(n,16777619)}return (n>>>0).toString(36)}
function safeMaterialURL(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function materialLink(url,label){let u=safeMaterialURL(url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:''}
function importedMaterials(){return arr(state.settings?.materialImports).filter(x=>x&&typeof x.en==='string'&&typeof x.id==='string')}
/* V1.8: legacy records never had a true batch or timestamp. Preserve them, group only by saved source + URL. */
function migrateMaterialBatches(data){
 let st=data.settings, items=arr(st.materialImports), batches=arr(st.materialBatches).filter(b=>b&&typeof b.id==='string'&&b.id);
 let known=new Set(batches.map(b=>b.id)), legacy=new Map(), itemIds=new Set();
 for(let x of items){if(!x||typeof x.en!=='string'||typeof x.id!=='string')continue;
  if(itemIds.has(x.id))x.id='import-'+uid();itemIds.add(x.id);
  if(known.has(x.batchId))continue;
  let source=typeof x.source==='string'&&x.source?x.source:'未记录来源',url=typeof x.url==='string'?x.url:'';
  let key=JSON.stringify([source,url]);let b=legacy.get(key);
  if(!b){b={id:'legacy-'+uid(),name:source.startsWith('外部文件 · ')?source.slice('外部文件 · '.length):'旧版来源组',source,url,created:'',legacy:true,added:0,rows:null};legacy.set(key,b);batches.push(b)}
  x.batchId=b.id;b.added++;
 }
 st.materialBatches=batches;return data;
}
function importBatches(){return arr(state.settings?.materialBatches)}
function batchItems(id){return importedMaterials().filter(x=>x.batchId===id)}
function batchLabel(b){return b.legacy?'旧版 · '+b.source:b.name||b.source||'未命名导入'}
function batchDate(v){if(!v)return '时间未记录';let d=new Date(v);return isNaN(d)?'时间未记录':d.toLocaleString('zh-CN',{hour12:false})}
function batchOptions(){return `<label class="batch-filter-label">导入批次<select id="materialBatch"><option value="">全部批次</option>${importBatches().filter(b=>batchItems(b.id).length||b.id===materialUI.batch).map(b=>`<option value="${esc(b.id)}" ${b.id===materialUI.batch?'selected':''}>${esc(batchLabel(b))} · ${batchItems(b.id).length} 条</option>`).join('')}</select></label>`}
function batchHistory(){
 let batches=[...importBatches()].sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')));
 let body=`<div class="notice">每次导入独立记录文件名、时间、来源和实际新增数量。删除只影响本次新增的外部素材；内置素材、其他批次、作文、范文及已收藏笔记均保留。</div>${batches.some(b=>b.legacy)?'<div class="notice warn">旧版未记录导入批次和时间，以下「旧版来源组」仅按原有来源名称和网址归组，可能包含多次导入。请先查看词条核对，不会推测导入日期。</div>':''}<div class="row between batch-history-summary"><strong>${batches.length} 条导入记录 / 来源组</strong><span class="muted tiny">现存外部素材 ${importedMaterials().length} 条</span></div>${batches.length?`<div class="stack">${batches.map(b=>{let items=batchItems(b.id),count=items.length,added=Number.isFinite(b.added)?b.added:count,removed=Math.max(0,added-count);return `<article class="card batch-history-card"><div class="row between"><h3>${esc(batchLabel(b))}</h3>${tag(count?'现存 '+count+' 条':'已全部删除',count?'green':'')}</div><div class="muted tiny">${b.legacy?'旧版来源组 · 时间未记录':esc(batchDate(b.created))}${!b.legacy&&b.source?' · '+esc(b.source):''}</div><div class="batch-metrics"><span>${b.legacy?'迁移时记录':'实际新增'} <strong>${added}</strong></span><span>已删除 <strong>${removed}</strong></span>${Number.isFinite(b.rows)?`<span>跳过重复或无效 <strong>${Math.max(0,b.rows-added)}</strong></span>`:''}</div>${b.lastDeleted?`<div class="muted tiny">最近删除：${esc(batchDate(b.lastDeleted))}</div>`:''}${count?`<div class="batch-sample muted tiny">词条示例：${items.slice(0,4).map(x=>esc(x.en.slice(0,100))).join(' · ')}</div>`:''}<div class="row">${btn('查看词条','material-batch-view',`data-id="${esc(b.id)}" ${count?'':'disabled'}`,'small')}${btn(b.legacy?'删除此来源组':'删除整批素材','material-batch-delete',`data-id="${esc(b.id)}" ${count?'':'disabled'}`,'small danger')}</div></article>`}).join('')}</div>`:empty('暂无导入记录','导入素材后，记录会自动保存在这里。')}`;
 showModal('导入记录管理',body,btn('关闭','close-modal'),{kind:'material-history'});
}
function clearDeletedDaily(st,ids){let d=st.dailyNotes;if(!d||typeof d!=='object')return;d.history=arr(d.history).filter(id=>!ids.has(id));if(ids.has(d.id)){d.id='';d.date=''}}
async function removeImported(ids,batchId=''){
 let set=new Set(ids),selected=importedMaterials().filter(x=>set.has(x.id)&&(!batchId||x.batchId===batchId));if(!selected.length)return;
 let actual=new Set(selected.map(x=>x.id)),affected=new Set(selected.map(x=>x.batchId)),stamp=now();
 if(await commit(s=>{s.settings.materialImports=arr(s.settings.materialImports).filter(x=>!x||!actual.has(x.id));for(let b of arr(s.settings.materialBatches))if(affected.has(b.id))b.lastDeleted=stamp;clearDeletedDaily(s.settings,actual)},`已删除 ${selected.length} 条外部素材（笔记保留）`)){
  dailyMemory={};let history=modal?.kind==='material-history';if(modal)closeModal(true);render();if(history)batchHistory();
 }
}
async function deleteMaterial(id){let x=importedMaterials().find(x=>x.id===id);if(!x){toast('仅外部导入的素材可以删除；原始学习资料受保护。',true);return}if(confirm(`确定删除这条外部素材？\n${x.en.slice(0,200)}\n已收藏到笔记的内容会保留。`))await removeImported([id],x.batchId)}
async function deleteMaterialBatch(id){let b=importBatches().find(x=>x.id===id),items=batchItems(id);if(!b||!items.length)return;let sample=items.slice(0,4).map(x=>x.en.slice(0,100)).join(' / ');if(confirm(`确定删除「${batchLabel(b)}」现存的 ${items.length} 条素材？\n${b.legacy?'注意：旧版来源组可能包含多次导入，请核对后操作。\n':''}示例：${sample}\n仅删除此组外部素材，其他批次与已收藏笔记保留。导入记录将保留。此操作不能直接撤销。`))await removeImported(items.map(x=>x.id),id)}
function openMaterialBatch(id){if(!importBatches().some(b=>b.id===id))return;closeModal(true);Object.assign(materialUI,{q:'',type:'all',source:'imported',task:'all',page:0,onlySaved:false,batch:id});go('materials')}
function deleteMaterialButton(x){return materialSourceType(x)==='imported'?btn('删除','material-delete',`data-id="${esc(x.id)}"`,'small danger'):''}

function personalMaterials(){let out=[];function add(en,source,opts={}){en=cleanMaterial(en,3000);if(!en||!/[a-zA-Z]{2}/.test(en))return;let key='personal-'+materialHash(source+'|'+en);out.push({id:key,type:'个人素材',en,cn:'',example:'',translation:'',tip:'来自你的资料，未经独立语言校验；结合原文理解。',topic:'个人积累',task:'',source,...opts})}
 for(let m of state.models){if(m.studioDemo===DEMO_MARK)continue;for(let exp of arr(m.expressions))add(exp,'范文精选表达 · '+titleOf(m),{modelId:m.id,task:m.task,topic:category(m)});if(!arr(m.expressions).length){let lines=splitSentences(m.content||'').filter(x=>wc(x.text)>=9&&wc(x.text)<=45&&!/[#|`]/.test(x.text)&&!/[\u4e00-\u9fff]/.test(x.text));for(let x of lines.slice(0,5))add(x.text,'范文摘句 · '+titleOf(m),{modelId:m.id,task:m.task,topic:category(m)})}}
 for(let e of state.essays)if(e.studioDemo!==DEMO_MARK)for(let r of arr(e.reviews))add(r.improved||r.corrected,'个人精批 · '+titleOf(e)+' · '+(r.key||''),{essayId:e.id,task:e.task,topic:category(e),tip:cleanMaterial(r.explanation,1600)||'来自你的精批记录，请结合原句和上下文复习。'});
 for(let n of state.notes)if(n.studioDemo!==DEMO_MARK&&!n.materialKey&&[NOTE_TYPES[2],NOTE_TYPES[3],NOTE_TYPES[4],NOTE_TYPES[5],NOTE_TYPES[1]].includes(n.category))add(n.content,'个人笔记 · '+n.title,{noteId:n.id,topic:n.category});
 return out}
function materialPool(source='all'){let imported=importedMaterials(), personal=source==='core'||source==='imported'?[]:personalMaterials(), a=source==='core'?DAILY_CORE:source==='personal'?personal:source==='imported'?imported:source==='curated'?[...DAILY_CORE,...personal]:[...DAILY_CORE,...imported,...personal];let seen=new Set();return a.filter(x=>{let k=materialKey(x);if(!k||seen.has(k))return false;seen.add(k);return true})}
function materialSourceType(x){return x.id.startsWith('core-')?'core':x.id.startsWith('personal-')?'personal':'imported'}
function findMaterial(id){return DAILY_CORE.find(x=>x.id===id)||importedMaterials().find(x=>x.id===id)||personalMaterials().find(x=>x.id===id)}
function savedMaterial(x){return state.notes.some(n=>n.materialKey===materialKey(x))}
function materialText(x){return [x.en,x.cn,x.example&&'例句 / 论证链：\n'+x.example,x.translation,x.tip&&'用法：'+x.tip,x.source&&'来源：'+x.source,safeMaterialURL(x.url)].filter(Boolean).join('\n\n')}
function materialBody(x){let raw=materialSourceType(x)==='personal'||x.type==='外部词表';return `<div class="daily-expression ${raw?'daily-raw':''}">${esc(x.en)}</div>${x.cn?`<div class="daily-cn">${esc(x.cn)}</div>`:raw?'<div class="muted tiny">此条为原始素材，未提供经整理的中文释义。</div>':''}${x.example?`<div class="daily-example"><div class="daily-caption">${x.type==='Task 2 论证'?'ARGUMENT CHAIN · 论证链':'WRITING EXAMPLE · 写作例句'}</div><div class="daily-example-en">${esc(x.example)}</div>${x.translation?`<div class="daily-translation">${esc(x.translation)}</div>`:''}</div>`:''}${x.tip?`<div class="daily-tip"><span>用法提醒</span><div>${esc(x.tip)}</div></div>`:''}`}
function materialActions(x){let saved=savedMaterial(x);return `<div class="row daily-actions">${btn(saved?'✓ 已收藏':'☆ 收藏到笔记','material-save',`data-id="${esc(x.id)}" ${saved?'disabled':''}`,'small')}${btn('复制','material-copy',`data-id="${esc(x.id)}"`,'small')}${deleteMaterialButton(x)}${x.essayId?btn('查看作文精批','open-essay',`data-id="${esc(x.essayId)}" data-tab="feedback"`,'small plain'):''}${x.modelId?btn('查看范文','open-model',`data-id="${esc(x.modelId)}"`,'small plain'):''}${x.noteId?btn('查看笔记','open-note',`data-id="${esc(x.noteId)}"`,'small plain'):''}<span class="right muted tiny daily-origin">${esc(x.source||'未标注来源')}${x.url?' · '+materialLink(x.url,'参考链接 ↗'):''}</span></div>`}
function dailyConfig(){let d=state.settings?.dailyNotes;let cfg=d&&typeof d==='object'?d:{};return {...cfg,...dailyMemory,source:DAILY_SOURCES.some(([v])=>v===(dailyMemory.source||cfg.source))?(dailyMemory.source||cfg.source):'curated',type:DAILY_TYPES.includes(dailyMemory.type||cfg.type)?(dailyMemory.type||cfg.type):'all'}}
function dailyPool(cfg=dailyConfig()){return materialPool(cfg.source).filter(x=>cfg.type==='all'||x.type===cfg.type)}
function dailyDayNumber(){let d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function chooseDaily(cfg,advance=false){let pool=dailyPool(cfg),date=today(),stored=cfg.date===date&&pool.find(x=>x.id===cfg.id);if(stored&&!advance)return stored;if(!pool.length)return null;let history=arr(cfg.history);let recent=new Set(history);let choices=pool.filter(x=>!recent.has(x.id));if(!choices.length)choices=pool.filter(x=>x.id!==cfg.id);if(!choices.length)choices=pool;let types=[...new Set(choices.map(x=>x.type))];let type=cfg.type==='all'?types[(dailyDayNumber()+Math.max(0,Number(cfg.step)||0)+(advance?1:0))%types.length]:cfg.type;let subset=choices.filter(x=>x.type===type);if(!subset.length)subset=choices;return subset[(dailyDayNumber()+Math.max(0,Number(cfg.step)||0)+(advance?1:0))%subset.length]}
function dailyCard(){let cfg=dailyConfig(),x=chooseDaily(cfg);return `<section class="daily-card" id="dailyCard"><div class="daily-head"><div class="daily-brand"><span class="daily-icon">${uiIcon('models')}</span><div><h2>每日写作积累</h2><div class="daily-caption">DAILY WRITING NOTES · ${esc(today())}</div></div></div>${btn('浏览素材库 →','nav','data-page="materials"','small plain')}</div><div class="daily-controls"><label>来源<select id="dailySource">${DAILY_SOURCES.map(([v,l])=>`<option value="${v}" ${v===cfg.source?'selected':''}>${l}</option>`).join('')}</select></label><label>分类<select id="dailyType"><option value="all" ${cfg.type==='all'?'selected':''}>随机 · 全部类型</option>${opt(DAILY_TYPES,cfg.type)}</select></label><span class="daily-auto"><span class="storage-dot"></span>按日期自动更新</span></div>${x?`<div class="daily-main"><div class="row daily-tags">${tag(x.type,'green')}${x.task?tag(x.task):''}${x.topic?tag(x.topic):''}</div>${materialBody(x)}</div><div class="daily-footer">${materialActions(x)}${btn('↻ 换一条','daily-next','','primary small')}</div>`:`<div class="daily-main muted">该筛选条件暂时没有素材，可切换来源或类别。个人素材来自你已收藏的范文表达、精批和笔记。</div>`}</section>`}
function refreshDaily(){let el=$('dailyCard');if(el)el.outerHTML=dailyCard()}
async function updateDaily(changes={},advance=false){if(dailyBusy)return;dailyBusy=true;try{let cfg={...dailyConfig(),...changes};if(cfg.date!==today()){cfg.step=0;cfg.id=''}if(Object.keys(changes).length)cfg.id='';let x=chooseDaily(cfg,advance);let step=Math.min(1000000,Math.max(0,Number(cfg.step)||0)+(advance?1:0));let history=arr(cfg.history).filter(v=>typeof v==='string');if(x&&history.at(-1)!==x.id)history.push(x.id);let next={source:cfg.source,type:cfg.type,date:today(),id:x?.id||'',step,history:history.slice(-Math.max(177,Math.min(5000,dailyPool(cfg).length)))};dailyMemory=next;if(ready)await commit(s=>s.settings.dailyNotes=next,'');refreshDaily()}finally{dailyBusy=false}}
function ensureDaily(){if(route!=='dashboard'||dailyBusy)return;let cfg=dailyConfig(),x=chooseDaily(cfg);if(cfg.date!==today()||cfg.id!==(x?.id||''))void updateDaily()}
function materialsPage(){let a=materialPool('all'),personal=personalMaterials().length;return head('写作素材库','A growing collection · 词汇、搭配、句式与论证素材。',btn('＋ 导入素材','material-import','','primary')+btn('导入记录','material-history')+btn('导出素材 JSON','material-export'))+`<section class="materials-summary"><div><span>精选学习卡片</span><strong>${DAILY_CORE.length}</strong></div><div><span>外部导入</span><strong>${importedMaterials().length}</strong></div><div><span>个人素材（提取前去重）</span><strong>${personal}</strong></div><div><span>已收藏至笔记</span><strong>${state.notes.filter(n=>n.materialKey).length}</strong></div></section><div class="material-filters"><input id="materialSearch" value="${esc(materialUI.q)}" placeholder="搜索英文、中文、话题、例句…"><div class="row"><select id="materialSource"><option value="all">全部来源</option>${[['core','精选卡片'],['personal','个人素材'],['imported','外部导入']].map(([v,l])=>`<option value="${v}" ${materialUI.source===v?'selected':''}>${l}</option>`).join('')}</select>${batchOptions()}<select id="materialTask"><option value="all">全部 Task</option>${opt(['Task 1','Task 2'],materialUI.task)}</select><label class="check"><input type="checkbox" id="materialSaved" ${materialUI.onlySaved?'checked':''}>仅已收藏</label>${btn('来源与下载','material-sources','','small plain')}</div><div class="material-tabs">${[['all','全部'],...DAILY_TYPES.map(x=>[x,x])].map(([v,l])=>btn(l,'material-type',`data-type="${esc(v)}"`,materialUI.type===v?'active':'')).join('')}</div></div><div id="materialResults">${materialResults()}</div><p class="muted tiny">精选卡片为原创整理，并非官方评分认证或逐条引用的权威范文。Task 1 示例使用虚构数据；Task 2 论证链为练习思路。原始导入词表和个人摘录需自行复核。</p>`}
function materialResults(){let q=materialUI.q.trim().toLowerCase();let a=(materialUI.batch?batchItems(materialUI.batch):materialPool(materialUI.source)).filter(x=>(materialUI.type==='all'||x.type===materialUI.type)&&(materialUI.task==='all'||x.task?.includes(materialUI.task.slice(-1)))&&(!materialUI.onlySaved||savedMaterial(x))&&(!q||[x.en,x.cn,x.example,x.translation,x.tip,x.topic,x.source].join(' ').toLowerCase().includes(q)));let size=15,pages=Math.max(1,Math.ceil(a.length/size));materialUI.page=Math.min(Math.max(0,materialUI.page),pages-1);return `<div class="row between material-count"><span>${materialUI.batch?esc(batchLabel(importBatches().find(b=>b.id===materialUI.batch)||{}))+' · ':''}共 ${a.length} 条 · 第 ${materialUI.page+1} / ${pages} 页</span><div class="row">${btn('← 上一页','material-page',`data-dir="-1" ${materialUI.page===0?'disabled':''}`,'small')}${btn('下一页 →','material-page',`data-dir="1" ${materialUI.page===pages-1?'disabled':''}`,'small')}</div></div>${a.length?`<div class="material-grid">${a.slice(materialUI.page*size,(materialUI.page+1)*size).map(x=>`<article class="card material-item"><div class="row">${tag(x.type,'green')}${x.task?tag(x.task):''}${savedMaterial(x)?tag('已收藏','green'):''}</div><h3>${esc(x.en.length>180?x.en.slice(0,180)+'…':x.en)}</h3>${x.cn?`<p>${esc(x.cn)}</p>`:''}<div class="muted tiny">${esc(x.topic||'未分类')} · ${esc(x.source||'未标注来源')}</div><div class="row">${btn('查看详情','material-detail',`data-id="${esc(x.id)}"`,'small')}${btn(savedMaterial(x)?'✓ 已收藏':'☆ 收藏','material-save',`data-id="${esc(x.id)}" ${savedMaterial(x)?'disabled':''}`,'small plain')}${deleteMaterialButton(x)}</div></article>`).join('')}</div>`:empty('没有符合条件的素材','请调整搜索或筛选条件。')}`}
function refreshMaterials(){if($('materialResults'))$('materialResults').innerHTML=materialResults()}
function materialSources(){showModal('素材来源与开放资源',`<div class="notice">以下是已确认的参考和下载入口。开放词表未预装：当前制作环境无法获取原始下载文件。可联网下载后，通过本地导入扩充。请保留原始署名及许可信息。</div><div class="stack">${DAILY_REFS.map(([n,d,u])=>`<div class="card"><h3>${esc(n)}</h3><p>${esc(d)}</p>${materialLink(u,'打开资源 ↗')}</div>`).join('')}</div>`,btn('关闭','close-modal'),{kind:'material-sources'})}
function materialImportDialog(){showModal('导入写作素材',`<div class="notice">独立素材导入，不会替换你的作文或笔记。支持本版素材 JSON、对象数组 JSON、每行一个词/短语的 TXT，以及含 en / word / lemma / headword 列的 CSV（可选 cn、example、translation、tip、topic、type、task、source、url）。</div><label class="field">来源名称 / 署名与许可（建议填写）<input id="materialImportSource" placeholder="如 NAWL / Browne, Culligan & Phillips (2013)"></label><label class="field" style="margin-top:12px">来源网址（可选）<input id="materialImportURL" placeholder="https://…"></label><label class="field" style="margin-top:12px">选择素材文件<input type="file" id="materialFile" accept=".json,.txt,.csv"></label><div id="materialImportPreview" style="margin-top:12px"></div><p class="muted tiny">单次最大 8 MB / 10,000 条。按英文表达去重。原始词表不会被冒充为精选卡片或自动翻译；默认每日积累不展示原始导入内容，需选择相应来源。</p>`,btn('取消','close-modal')+btn('确认追加导入','material-confirm','id="materialConfirm" disabled','primary'),{kind:'material-import',data:null})}
function parseMaterialCSV(text){let rows=[],row=[],v='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){v+='"';i++}else if(c==='"')quoted=false;else v+=c}else if(c==='"'&&!v)quoted=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}if(quoted)throw Error('CSV 引号未闭合');row.push(v);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];let keys=rows.shift().map(k=>k.trim().toLowerCase());if(!keys.some(x=>['en','word','lemma','headword','expression'].includes(x)))throw Error('CSV 缺少 en / word / lemma / headword / expression 列');return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||''])))}
function parseMaterialFile(text,name){text=text.replace(/^\uFEFF/,'');if(/\.json$/i.test(name)){let data=JSON.parse(text);if(Array.isArray(data))return data;if(Array.isArray(data.items))return data.items;throw Error('JSON 必须为素材数组或含 items 数组的对象；原始嵌套语料需先转换')}if(/\.csv$/i.test(name))return parseMaterialCSV(text);if(/\.txt$/i.test(name))return text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));throw Error('仅支持 JSON、TXT、CSV')}
function normalizeMaterial(x,source,url){if(typeof x==='string')x={en:x};if(!x||typeof x!=='object')return null;let en=cleanMaterial(x.en||x.word||x.lemma||x.headword||x.expression,3000);if(!en||!/[A-Za-z]/.test(en))return null;let cn=cleanMaterial(x.cn||x.meaning),example=cleanMaterial(x.example),type=DAILY_TYPES.includes(x.type)&&x.type!=='个人素材'?x.type:(cn||example?'短语与搭配':'外部词表');return {id:'import-'+materialHash(materialKey({en})),type,en,cn,example,translation:cleanMaterial(x.translation),tip:cleanMaterial(x.tip)||'外部导入，未自动校验。',topic:cleanMaterial(x.topic,200)||'外部资料',task:['Task 1','Task 2','Task 1 & 2'].includes(x.task)?x.task:'',source:cleanMaterial(x.source,500)||source||'外部导入 · 未填写来源',url:safeMaterialURL(x.url)||url||''}}
async function previewMaterialFile(el){let f=el.files[0],owner=modal;if(!f||!owner)return;$('materialConfirm').disabled=true;owner.data=null;try{if(f.size>8*1024*1024)throw Error('文件超过 8 MB');let rows=parseMaterialFile(await f.text(),f.name);if(modal!==owner)return;if(rows.length>10000)throw Error('单次最多 10,000 条，请拆分文件');owner.data={rows,name:f.name};let valid=rows.map(x=>normalizeMaterial(x,'','')).filter(Boolean);let seen=new Set(materialPool('all').map(materialKey));let fresh=valid.filter(x=>{let k=materialKey(x);if(seen.has(k))return false;seen.add(k);return true});$('materialImportPreview').innerHTML=`<div class="notice">读取 ${rows.length} 行；可追加 ${fresh.length} 条，重复或无效 ${rows.length-fresh.length} 条。${fresh.slice(0,3).map(x=>'<br>'+esc(x.en)).join('')}</div>`;$('materialConfirm').disabled=!fresh.length}catch(e){if(modal===owner)$('materialImportPreview').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function confirmMaterialImport(){if(modal?.kind!=='material-import'||!modal.data)return;let source=cleanMaterial($('materialImportSource').value,500)||'外部文件 · '+modal.data.name,url=safeMaterialURL($('materialImportURL').value),seen=new Set(materialPool('all').map(materialKey));let fresh=modal.data.rows.map(x=>normalizeMaterial(x,source,url)).filter(x=>{if(!x)return false;let k=materialKey(x);if(seen.has(k))return false;seen.add(k);return true});if(!fresh.length){toast('没有可新增的素材。',true);return}let batch={id:'batch-'+uid(),name:modal.data.name,source,url,created:now(),legacy:false,rows:modal.data.rows.length,added:fresh.length};for(let x of fresh){x.id='import-'+uid();x.batchId=batch.id}if(await commit(s=>{s.settings.materialImports=[...arr(s.settings.materialImports),...fresh];s.settings.materialBatches=[...arr(s.settings.materialBatches),batch]},`已追加 ${fresh.length} 条素材，导入记录已保存`)){closeModal(true);Object.assign(materialUI,{q:'',type:'all',source:'imported',task:'all',page:0,onlySaved:false,batch:batch.id});if(route==='materials')render();else render()}}
async function saveMaterial(x){if(!x||savedMaterial(x))return;let note={id:uid(),title:x.en.slice(0,160),category:x.type==='学术词汇'||x.type==='外部词表'?NOTE_TYPES[2]:x.type==='Task 2 论证'?NOTE_TYPES[4]:x.type==='句式与语法'?NOTE_TYPES[3]:NOTE_TYPES[5],content:materialText(x),tags:['每日写作积累',x.type,x.topic].filter(Boolean).join(', '),essayId:x.essayId||'',modelId:x.modelId||'',created:now(),updated:now(),favorite:true,materialKey:materialKey(x)};if(await commit(s=>s.notes.push(note),'已收藏到我的笔记')){if(modal?.kind==='material-detail'){closeModal(true)}render()}}
async function dailyAction(el){let a=el.dataset.action,x=findMaterial(el.dataset.id);switch(a){case 'daily-next':await updateDaily({},true);break;case 'material-type':materialUI.type=el.dataset.type;materialUI.page=0;render();break;case 'material-page':materialUI.page+=Number(el.dataset.dir);refreshMaterials();break;case 'material-detail':if(x)showModal('素材详情',`<div class="daily-main"><div class="row">${tag(x.type,'green')}${tag(x.topic||'未分类')}</div>${materialBody(x)}${materialActions(x)}</div>`,btn('关闭','close-modal'),{kind:'material-detail'});break;case 'material-copy':if(x)await copyText(materialText(x));break;case 'material-save':await saveMaterial(x);break;case 'material-history':batchHistory();break;case 'material-batch-view':openMaterialBatch(el.dataset.id);break;case 'material-batch-delete':await deleteMaterialBatch(el.dataset.id);break;case 'material-delete':await deleteMaterial(el.dataset.id);break;case 'material-sources':materialSources();break;case 'material-import':materialImportDialog();break;case 'material-confirm':await confirmMaterialImport();break;case 'material-export':saveDownload(JSON.stringify({format:'ielts-writing-materials-v1',items:[...DAILY_CORE,...importedMaterials()]},null,2),'IELTS-writing-materials-'+today()+'.json');toast('已生成独立素材库文件（不含个人作文及笔记）');break}}

function nbSanitize(html){
 const source=document.createElement('template'),out=document.createElement('div');source.innerHTML=String(html||'');
 const allowed=new Set('P DIV SPAN BR H1 H2 H3 H4 H5 H6 B STRONG I EM U S STRIKE DEL MARK UL OL LI BLOCKQUOTE PRE CODE HR TABLE COLGROUP COL THEAD TBODY TFOOT TR TH TD A IMG FONT SUB SUP'.split(' '));
 const discard=new Set('SCRIPT STYLE IFRAME OBJECT EMBED SVG MATH VIDEO AUDIO SOURCE LINK META HEAD BUTTON INPUT SELECT TEXTAREA NOSCRIPT'.split(' '));
 function walk(node,parent){if(node.nodeType===3){parent.append(document.createTextNode(node.nodeValue));return}if(node.nodeType!==1)return;let t=node.tagName;if(discard.has(t))return;if(!allowed.has(t)){for(let c of node.childNodes)walk(c,parent);return}
 let el=document.createElement(t.toLowerCase());if(t==='IMG'){let src=node.getAttribute('src')||'';if(!safeImg(src))return;el.setAttribute('src',src);el.alt=(node.getAttribute('alt')||'笔记图片').slice(0,200);let w=parseInt(node.getAttribute('width')||node.style.width,10);if(w>0)el.setAttribute('width',Math.min(10000,w));parent.append(el);return}
 if(t==='A'){let u=nbURL(node.getAttribute('href'));if(u){el.href=u;el.target='_blank';el.rel='noopener noreferrer'}}
 if(t==='FONT'){let color=node.getAttribute('color');if(color)el.style.color=color;let size=node.getAttribute('size');if(/^[1-7]$/.test(size||''))el.setAttribute('size',size)}
 if(t==='TH'||t==='TD')for(let k of ['colspan','rowspan']){let v=parseInt(node.getAttribute(k),10);if(v>1&&v<=50)el.setAttribute(k,v)}
 if(['COL','COLGROUP'].includes(t)){let v=parseInt(node.getAttribute('span'),10);if(v>1&&v<=50)el.setAttribute('span',v)}
 if(['TABLE','COLGROUP','COL','TR','TD','TH'].includes(t))for(let k of ['width','height']){let v=node.style[k]||node.getAttribute(k)||'';if(/^\d+(?:\.\d+)?(?:px|%)?$/.test(v)&&parseFloat(v)>0&&parseFloat(v)<=10000)el.style[k]=/^\d+(?:\.\d+)?$/.test(v)?v+'px':v}
 for(let k of ['color','backgroundColor','fontWeight','fontStyle','textDecoration','textAlign','fontSize','whiteSpace']){let v=node.style[k];if(v&&!/url\s*\(|expression\s*\(|var\s*\(/i.test(v))el.style[k]=v}

}

/* Word-style table boundaries: edit the document itself, not an overlay.
   Widths are stored in a sanitized colgroup as percentages so narrow classroom
   layouts keep their proportions. Row heights are explicit CSS minimum heights. */
let nbTableEdge=null,nbTableDrag=null,nbTableSuppressClick=false;
function nbTableGrid(t){
 const rows=[...t.rows],slots=[],cells=[];let count=0;
 for(let r=0;r<rows.length;r++){
  slots[r]??=[];let c=0;
  for(const cell of rows[r].cells){while(slots[r][c])c++;let cs=cell.colSpan||1,rs=cell.rowSpan||1;
   if(cell.getAttribute('rowspan')==='0')rs=rows.length-r;
   const info={cell,r,c,cs,rs};cells.push(info);
   for(let y=r;y<Math.min(rows.length,r+rs);y++){slots[y]??=[];for(let x=c;x<c+cs;x++)slots[y][x]=true}
   c+=cs;count=Math.max(count,c);

 }

 for(let i=1;i<count;i++)if(edges[i]===null){let a=i-1,b=i+1;while(edges[b]===null&&b<count)b++;edges[i]=edges[a]+(edges[b]-edges[a])/(b-a)}
 return {rows,cells,count,edges,widths:edges.slice(1).map((v,i)=>Math.max(1,v-edges[i])),rect};
}
function nbTableFindEdge(e){
