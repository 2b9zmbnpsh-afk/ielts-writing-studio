let materialUI={q:'',type:'all',source:'all',task:'all',page:0,onlySaved:false,batch:''};
let dailyBusy=false, dailyMemory={};
function cleanMaterial(v,max=4000){return typeof v==='string'?v.trim().slice(0,max):''}
function materialKey(x){return String(x.en||'').trim().toLowerCase().replace(/\s+/g,' ')}
function materialHash(s){let n=2166136261;for(let i=0;i<s.length;i++){n^=s.charCodeAt(i);n=Math.imul(n,16777619)}return (n>>>0).toString(36)}
function safeMaterialURL(s){try{let u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function materialLink(url,label){let u=safeMaterialURL(url);return u?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:''}
function importedMaterials(){return arr(state.settings?.materialImports).filter(x=>x&&typeof x.en==='string'&&typeof x.id==='string')}
/* V1.8: legacy records never had a true batch or timestamp. Preserve them, group only by saved source + URL. */
function migrateMaterialBatches(data){
 let st=data.settings, items=arr(st.materialImports), batches=arr(st.materialBatches).filter(b=>b&&typeof b.id==='string'&&b.id);
 let known=new Set(batches.map(b=>b.id)), legacy=new Map(), itemIds=new Set();
 for(let x of items){if(!x||typeof x.en!=='string'||typeof x.id!=='string')continue;
  if(itemIds.has(x.id))x.id='import-'+uid();itemIds.add(x.id);
  if(known.has(x.batchId))continue;
  let source=typeof x.source==='string'&&x.source?x.source:'未记录来源',url=typeof x.url==='string'?x.url:'';
  let key=JSON.stringify([source,url]);let b=legacy.get(key);
  if(!b){b={id:'legacy-'+uid(),name:source.startsWith('外部文件 · ')?source.slice('外部文件 · '.length):'旧版来源组',source,url,created:'',legacy:true,added:0,rows:null};legacy.set(key,b);batches.push(b)}
  x.batchId=b.id;b.added++;
 }
 st.materialBatches=batches;return data;
}
function importBatches(){return arr(state.settings?.materialBatches)}
function batchItems(id){return importedMaterials().filter(x=>x.batchId===id)}
function batchLabel(b){return b.legacy?'旧版 · '+b.source:b.name||b.source||'未命名导入'}
function batchDate(v){if(!v)return '时间未记录';let d=new Date(v);return isNaN(d)?'时间未记录':d.toLocaleString('zh-CN',{hour12:false})}
function batchOptions(){return `<label class="batch-filter-label">导入批次<select id="materialBatch"><option value="">全部批次</option>${importBatches().filter(b=>batchItems(b.id).length||b.id===materialUI.batch).map(b=>`<option value="${esc(b.id)}" ${b.id===materialUI.batch?'selected':''}>${esc(batchLabel(b))} · ${batchItems(b.id).length} 条</option>`).join('')}</select></label>`}
function batchHistory(){
 let batches=[...importBatches()].sort((a,b)=>String(b.created||'').localeCompare(String(a.created||'')));
 let body=`<div class="notice">每次导入独立记录文件名、时间、来源和实际新增数量。删除只影响本次新增的外部素材；内置素材、其他批次、作文、范文及已收藏笔记均保留。</div>${batches.some(b=>b.legacy)?'<div class="notice warn">旧版未记录导入批次和时间，以下「旧版来源组」仅按原有来源名称和网址归组，可能包含多次导入。请先查看词条核对，不会推测导入日期。</div>':''}<div class="row between batch-history-summary"><strong>${batches.length} 条导入记录 / 来源组</strong><span class="muted tiny">现存外部素材 ${importedMaterials().length} 条</span></div>${batches.length?`<div class="stack">${batches.map(b=>{let items=batchItems(b.id),count=items.length,added=Number.isFinite(b.added)?b.added:count,removed=Math.max(0,added-count);return `<article class="card batch-history-card"><div class="row between"><h3>${esc(batchLabel(b))}</h3>${tag(count?'现存 '+count+' 条':'已全部删除',count?'green':'')}</div><div class="muted tiny">${b.legacy?'旧版来源组 · 时间未记录':esc(batchDate(b.created))}${!b.legacy&&b.source?' · '+esc(b.source):''}</div><div class="batch-metrics"><span>${b.legacy?'迁移时记录':'实际新增'} <strong>${added}</strong></span><span>已删除 <strong>${removed}</strong></span>${Number.isFinite(b.rows)?`<span>跳过重复或无效 <strong>${Math.max(0,b.rows-added)}</strong></span>`:''}</div>${b.lastDeleted?`<div class="muted tiny">最近删除：${esc(batchDate(b.lastDeleted))}</div>`:''}${count?`<div class="batch-sample muted tiny">词条示例：${items.slice(0,4).map(x=>esc(x.en.slice(0,100))).join(' · ')}</div>`:''}<div class="row">${btn('查看词条','material-batch-view',`data-id="${esc(b.id)}" ${count?'':'disabled'}`,'small')}${btn(b.legacy?'删除此来源组':'删除整批素材','material-batch-delete',`data-id="${esc(b.id)}" ${count?'':'disabled'}`,'small danger')}</div></article>`}).join('')}</div>`:empty('暂无导入记录','导入素材后，记录会自动保存在这里。')}`;
 showModal('导入记录管理',body,btn('关闭','close-modal'),{kind:'material-history'});
}
function clearDeletedDaily(st,ids){let d=st.dailyNotes;if(!d||typeof d!=='object')return;d.history=arr(d.history).filter(id=>!ids.has(id));if(ids.has(d.id)){d.id='';d.date=''}}
async function removeImported(ids,batchId=''){
 let set=new Set(ids),selected=importedMaterials().filter(x=>set.has(x.id)&&(!batchId||x.batchId===batchId));if(!selected.length)return;
 let actual=new Set(selected.map(x=>x.id)),affected=new Set(selected.map(x=>x.batchId)),stamp=now();
 if(await commit(s=>{s.settings.materialImports=arr(s.settings.materialImports).filter(x=>!x||!actual.has(x.id));for(let b of arr(s.settings.materialBatches))if(affected.has(b.id))b.lastDeleted=stamp;clearDeletedDaily(s.settings,actual)},`已删除 ${selected.length} 条外部素材（笔记保留）`)){
  dailyMemory={};let history=modal?.kind==='material-history';if(modal)closeModal(true);render();if(history)batchHistory();
 }
}
async function deleteMaterial(id){let x=importedMaterials().find(x=>x.id===id);if(!x){toast('仅外部导入的素材可以删除；原始学习资料受保护。',true);return}if(confirm(`确定删除这条外部素材？\n${x.en.slice(0,200)}\n已收藏到笔记的内容会保留。`))await removeImported([id],x.batchId)}
async function deleteMaterialBatch(id){let b=importBatches().find(x=>x.id===id),items=batchItems(id);if(!b||!items.length)return;let sample=items.slice(0,4).map(x=>x.en.slice(0,100)).join(' / ');if(confirm(`确定删除「${batchLabel(b)}」现存的 ${items.length} 条素材？\n${b.legacy?'注意：旧版来源组可能包含多次导入，请核对后操作。\n':''}示例：${sample}\n仅删除此组外部素材，其他批次与已收藏笔记保留。导入记录将保留。此操作不能直接撤销。`))await removeImported(items.map(x=>x.id),id)}
function openMaterialBatch(id){if(!importBatches().some(b=>b.id===id))return;closeModal(true);Object.assign(materialUI,{q:'',type:'all',source:'imported',task:'all',page:0,onlySaved:false,batch:id});go('materials')}
function deleteMaterialButton(x){return materialSourceType(x)==='imported'?btn('删除','material-delete',`data-id="${esc(x.id)}"`,'small danger'):''}

function personalMaterials(){let out=[];function add(en,source,opts={}){en=cleanMaterial(en,3000);if(!en||!/[a-zA-Z]{2}/.test(en))return;let key='personal-'+materialHash(source+'|'+en);out.push({id:key,type:'个人素材',en,cn:'',example:'',translation:'',tip:'来自你的资料，未经独立语言校验；结合原文理解。',topic:'个人积累',task:'',source,...opts})}
 for(let m of state.models){for(let exp of arr(m.expressions))add(exp,'范文精选表达 · '+titleOf(m),{modelId:m.id,task:m.task,topic:category(m)});if(!arr(m.expressions).length){let lines=splitSentences(m.content||'').filter(x=>wc(x.text)>=9&&wc(x.text)<=45&&!/[#|`]/.test(x.text)&&!/[\u4e00-\u9fff]/.test(x.text));for(let x of lines.slice(0,5))add(x.text,'范文摘句 · '+titleOf(m),{modelId:m.id,task:m.task,topic:category(m)})}}
 for(let e of state.essays)for(let r of arr(e.reviews))add(r.improved||r.corrected,'个人精批 · '+titleOf(e)+' · '+(r.key||''),{essayId:e.id,task:e.task,topic:category(e),tip:cleanMaterial(r.explanation,1600)||'来自你的精批记录，请结合原句和上下文复习。'});
 for(let n of state.notes)if(!n.materialKey&&[NOTE_TYPES[2],NOTE_TYPES[3],NOTE_TYPES[4],NOTE_TYPES[5],NOTE_TYPES[1]].includes(n.category))add(n.content,'个人笔记 · '+n.title,{noteId:n.id,topic:n.category});
 return out}
function materialPool(source='all'){let imported=importedMaterials(), personal=source==='core'||source==='imported'?[]:personalMaterials(), a=source==='core'?DAILY_CORE:source==='personal'?personal:source==='imported'?imported:source==='curated'?[...DAILY_CORE,...personal]:[...DAILY_CORE,...imported,...personal];let seen=new Set();return a.filter(x=>{let k=materialKey(x);if(!k||seen.has(k))return false;seen.add(k);return true})}
function materialSourceType(x){return x.id.startsWith('core-')?'core':x.id.startsWith('personal-')?'personal':'imported'}
function findMaterial(id){return DAILY_CORE.find(x=>x.id===id)||importedMaterials().find(x=>x.id===id)||personalMaterials().find(x=>x.id===id)}
function savedMaterial(x){return state.notes.some(n=>n.materialKey===materialKey(x))}
function materialText(x){return [x.en,x.cn,x.example&&'例句 / 论证链：\n'+x.example,x.translation,x.tip&&'用法：'+x.tip,x.source&&'来源：'+x.source,safeMaterialURL(x.url)].filter(Boolean).join('\n\n')}
function materialBody(x){let raw=materialSourceType(x)==='personal'||x.type==='外部词表';return `<div class="daily-expression ${raw?'daily-raw':''}">${esc(x.en)}</div>${x.cn?`<div class="daily-cn">${esc(x.cn)}</div>`:raw?'<div class="muted tiny">此条为原始素材，未提供经整理的中文释义。</div>':''}${x.example?`<div class="daily-example"><div class="daily-caption">${x.type==='Task 2 论证'?'ARGUMENT CHAIN · 论证链':'WRITING EXAMPLE · 写作例句'}</div><div class="daily-example-en">${esc(x.example)}</div>${x.translation?`<div class="daily-translation">${esc(x.translation)}</div>`:''}</div>`:''}${x.tip?`<div class="daily-tip"><span>用法提醒</span><div>${esc(x.tip)}</div></div>`:''}`}
function materialActions(x){let saved=savedMaterial(x);return `<div class="row daily-actions">${btn(saved?'✓ 已收藏':'☆ 收藏到笔记','material-save',`data-id="${esc(x.id)}" ${saved?'disabled':''}`,'small')}${btn('复制','material-copy',`data-id="${esc(x.id)}"`,'small')}${deleteMaterialButton(x)}${x.essayId?btn('查看作文精批','open-essay',`data-id="${esc(x.essayId)}" data-tab="feedback"`,'small plain'):''}${x.modelId?btn('查看范文','open-model',`data-id="${esc(x.modelId)}"`,'small plain'):''}${x.noteId?btn('查看笔记','open-note',`data-id="${esc(x.noteId)}"`,'small plain'):''}<span class="right muted tiny daily-origin">${esc(x.source||'未标注来源')}${x.url?' · '+materialLink(x.url,'参考链接 ↗'):''}</span></div>`}
function dailyConfig(){let d=state.settings?.dailyNotes;let cfg=d&&typeof d==='object'?d:{};return {...cfg,...dailyMemory,source:DAILY_SOURCES.some(([v])=>v===(dailyMemory.source||cfg.source))?(dailyMemory.source||cfg.source):'curated',type:DAILY_TYPES.includes(dailyMemory.type||cfg.type)?(dailyMemory.type||cfg.type):'all'}}
function dailyPool(cfg=dailyConfig()){return materialPool(cfg.source).filter(x=>cfg.type==='all'||x.type===cfg.type)}
function dailyDayNumber(){let d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000)}
function chooseDaily(cfg,advance=false){let pool=dailyPool(cfg),date=today(),stored=cfg.date===date&&pool.find(x=>x.id===cfg.id);if(stored&&!advance)return stored;if(!pool.length)return null;let history=arr(cfg.history);let recent=new Set(history);let choices=pool.filter(x=>!recent.has(x.id));if(!choices.length)choices=pool.filter(x=>x.id!==cfg.id);if(!choices.length)choices=pool;let types=[...new Set(choices.map(x=>x.type))];let type=cfg.type==='all'?types[(dailyDayNumber()+Math.max(0,Number(cfg.step)||0)+(advance?1:0))%types.length]:cfg.type;let subset=choices.filter(x=>x.type===type);if(!subset.length)subset=choices;return subset[(dailyDayNumber()+Math.max(0,Number(cfg.step)||0)+(advance?1:0))%subset.length]}
function dailyCard(){let cfg=dailyConfig(),x=chooseDaily(cfg);return `<section class="daily-card" id="dailyCard"><div class="daily-head"><div class="daily-brand"><span class="daily-icon">${uiIcon('models')}</span><div><h2>每日写作积累</h2><div class="daily-caption">DAILY WRITING NOTES · ${esc(today())}</div></div></div>${btn('浏览素材库 →','nav','data-page="materials"','small plain')}</div><div class="daily-controls"><label>来源<select id="dailySource">${DAILY_SOURCES.map(([v,l])=>`<option value="${v}" ${v===cfg.source?'selected':''}>${l}</option>`).join('')}</select></label><label>分类<select id="dailyType"><option value="all" ${cfg.type==='all'?'selected':''}>随机 · 全部类型</option>${opt(DAILY_TYPES,cfg.type)}</select></label><span class="daily-auto"><span class="storage-dot"></span>按日期自动更新</span></div>${x?`<div class="daily-main"><div class="row daily-tags">${tag(x.type,'green')}${x.task?tag(x.task):''}${x.topic?tag(x.topic):''}</div>${materialBody(x)}</div><div class="daily-footer">${materialActions(x)}${btn('↻ 换一条','daily-next','','primary small')}</div>`:`<div class="daily-main muted">该筛选条件暂时没有素材，可切换来源或类别。个人素材来自你已收藏的范文表达、精批和笔记。</div>`}</section>`}
function refreshDaily(){let el=$('dailyCard');if(el)el.outerHTML=dailyCard()}
async function updateDaily(changes={},advance=false){if(dailyBusy)return;dailyBusy=true;try{let cfg={...dailyConfig(),...changes};if(cfg.date!==today()){cfg.step=0;cfg.id=''}if(Object.keys(changes).length)cfg.id='';let x=chooseDaily(cfg,advance);let step=Math.min(1000000,Math.max(0,Number(cfg.step)||0)+(advance?1:0));let history=arr(cfg.history).filter(v=>typeof v==='string');if(x&&history.at(-1)!==x.id)history.push(x.id);let next={source:cfg.source,type:cfg.type,date:today(),id:x?.id||'',step,history:history.slice(-Math.max(177,Math.min(5000,dailyPool(cfg).length)))};dailyMemory=next;if(ready)await commit(s=>s.settings.dailyNotes=next,'');refreshDaily()}finally{dailyBusy=false}}
function ensureDaily(){if(route!=='dashboard'||dailyBusy)return;let cfg=dailyConfig(),x=chooseDaily(cfg);if(cfg.date!==today()||cfg.id!==(x?.id||''))void updateDaily()}
function materialsPage(){let a=materialPool('all'),personal=personalMaterials().length;return head('写作素材库','A growing collection · 词汇、搭配、句式与论证素材。',btn('＋ 导入素材','material-import','','primary')+btn('导入记录','material-history')+btn('导出素材 JSON','material-export'))+`<section class="materials-summary"><div><span>精选学习卡片</span><strong>${DAILY_CORE.length}</strong></div><div><span>外部导入</span><strong>${importedMaterials().length}</strong></div><div><span>个人素材（提取前去重）</span><strong>${personal}</strong></div><div><span>已收藏至笔记</span><strong>${state.notes.filter(n=>n.materialKey).length}</strong></div></section><div class="material-filters"><input id="materialSearch" value="${esc(materialUI.q)}" placeholder="搜索英文、中文、话题、例句…"><div class="row"><select id="materialSource"><option value="all">全部来源</option>${[['core','精选卡片'],['personal','个人素材'],['imported','外部导入']].map(([v,l])=>`<option value="${v}" ${materialUI.source===v?'selected':''}>${l}</option>`).join('')}</select>${batchOptions()}<select id="materialTask"><option value="all">全部 Task</option>${opt(['Task 1','Task 2'],materialUI.task)}</select><label class="check"><input type="checkbox" id="materialSaved" ${materialUI.onlySaved?'checked':''}>仅已收藏</label>${btn('来源与下载','material-sources','','small plain')}</div><div class="material-tabs">${[['all','全部'],...DAILY_TYPES.map(x=>[x,x])].map(([v,l])=>btn(l,'material-type',`data-type="${esc(v)}"`,materialUI.type===v?'active':'')).join('')}</div></div><div id="materialResults">${materialResults()}</div><p class="muted tiny">精选卡片为原创整理，并非官方评分认证或逐条引用的权威范文。Task 1 示例使用虚构数据；Task 2 论证链为练习思路。原始导入词表和个人摘录需自行复核。</p>`}
function materialResults(){let q=materialUI.q.trim().toLowerCase();let a=(materialUI.batch?batchItems(materialUI.batch):materialPool(materialUI.source)).filter(x=>(materialUI.type==='all'||x.type===materialUI.type)&&(materialUI.task==='all'||x.task?.includes(materialUI.task.slice(-1)))&&(!materialUI.onlySaved||savedMaterial(x))&&(!q||[x.en,x.cn,x.example,x.translation,x.tip,x.topic,x.source].join(' ').toLowerCase().includes(q)));let size=15,pages=Math.max(1,Math.ceil(a.length/size));materialUI.page=Math.min(Math.max(0,materialUI.page),pages-1);return `<div class="row between material-count"><span>${materialUI.batch?esc(batchLabel(importBatches().find(b=>b.id===materialUI.batch)||{}))+' · ':''}共 ${a.length} 条 · 第 ${materialUI.page+1} / ${pages} 页</span><div class="row">${btn('← 上一页','material-page',`data-dir="-1" ${materialUI.page===0?'disabled':''}`,'small')}${btn('下一页 →','material-page',`data-dir="1" ${materialUI.page===pages-1?'disabled':''}`,'small')}</div></div>${a.length?`<div class="material-grid">${a.slice(materialUI.page*size,(materialUI.page+1)*size).map(x=>`<article class="card material-item"><div class="row">${tag(x.type,'green')}${x.task?tag(x.task):''}${savedMaterial(x)?tag('已收藏','green'):''}</div><h3>${esc(x.en.length>180?x.en.slice(0,180)+'…':x.en)}</h3>${x.cn?`<p>${esc(x.cn)}</p>`:''}<div class="muted tiny">${esc(x.topic||'未分类')} · ${esc(x.source||'未标注来源')}</div><div class="row">${btn('查看详情','material-detail',`data-id="${esc(x.id)}"`,'small')}${btn(savedMaterial(x)?'✓ 已收藏':'☆ 收藏','material-save',`data-id="${esc(x.id)}" ${savedMaterial(x)?'disabled':''}`,'small plain')}${deleteMaterialButton(x)}</div></article>`).join('')}</div>`:empty('没有符合条件的素材','请调整搜索或筛选条件。')}`}
function refreshMaterials(){if($('materialResults'))$('materialResults').innerHTML=materialResults()}
function materialSources(){showModal('素材来源与开放资源',`<div class="notice">以下是已确认的参考和下载入口。开放词表未预装：当前制作环境无法获取原始下载文件。可联网下载后，通过本地导入扩充。请保留原始署名及许可信息。</div><div class="stack">${DAILY_REFS.map(([n,d,u])=>`<div class="card"><h3>${esc(n)}</h3><p>${esc(d)}</p>${materialLink(u,'打开资源 ↗')}</div>`).join('')}</div>`,btn('关闭','close-modal'),{kind:'material-sources'})}
function materialImportDialog(){showModal('导入写作素材',`<div class="notice">独立素材导入，不会替换你的作文或笔记。支持本版素材 JSON、对象数组 JSON、每行一个词/短语的 TXT，以及含 en / word / lemma / headword 列的 CSV（可选 cn、example、translation、tip、topic、type、task、source、url）。</div><label class="field">来源名称 / 署名与许可（建议填写）<input id="materialImportSource" placeholder="如 NAWL / Browne, Culligan & Phillips (2013)"></label><label class="field" style="margin-top:12px">来源网址（可选）<input id="materialImportURL" placeholder="https://…"></label><label class="field" style="margin-top:12px">选择素材文件<input type="file" id="materialFile" accept=".json,.txt,.csv"></label><div id="materialImportPreview" style="margin-top:12px"></div><p class="muted tiny">单次最大 8 MB / 10,000 条。按英文表达去重。原始词表不会被冒充为精选卡片或自动翻译；默认每日积累不展示原始导入内容，需选择相应来源。</p>`,btn('取消','close-modal')+btn('确认追加导入','material-confirm','id="materialConfirm" disabled','primary'),{kind:'material-import',data:null})}
function parseMaterialCSV(text){let rows=[],row=[],v='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){v+='"';i++}else if(c==='"')quoted=false;else v+=c}else if(c==='"'&&!v)quoted=true;else if(c===','){row.push(v);v=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}if(quoted)throw Error('CSV 引号未闭合');row.push(v);if(row.some(x=>x.trim()))rows.push(row);if(!rows.length)return [];let keys=rows.shift().map(k=>k.trim().toLowerCase());if(!keys.some(x=>['en','word','lemma','headword','expression'].includes(x)))throw Error('CSV 缺少 en / word / lemma / headword / expression 列');return rows.map(r=>Object.fromEntries(keys.map((k,i)=>[k,r[i]||''])))}
function parseMaterialFile(text,name){text=text.replace(/^\uFEFF/,'');if(/\.json$/i.test(name)){let data=JSON.parse(text);if(Array.isArray(data))return data;if(Array.isArray(data.items))return data.items;throw Error('JSON 必须为素材数组或含 items 数组的对象；原始嵌套语料需先转换')}if(/\.csv$/i.test(name))return parseMaterialCSV(text);if(/\.txt$/i.test(name))return text.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#'));throw Error('仅支持 JSON、TXT、CSV')}
function normalizeMaterial(x,source,url){if(typeof x==='string')x={en:x};if(!x||typeof x!=='object')return null;let en=cleanMaterial(x.en||x.word||x.lemma||x.headword||x.expression,3000);if(!en||!/[A-Za-z]/.test(en))return null;let cn=cleanMaterial(x.cn||x.meaning),example=cleanMaterial(x.example),type=DAILY_TYPES.includes(x.type)&&x.type!=='个人素材'?x.type:(cn||example?'短语与搭配':'外部词表');return {id:'import-'+materialHash(materialKey({en})),type,en,cn,example,translation:cleanMaterial(x.translation),tip:cleanMaterial(x.tip)||'外部导入，未自动校验。',topic:cleanMaterial(x.topic,200)||'外部资料',task:['Task 1','Task 2','Task 1 & 2'].includes(x.task)?x.task:'',source:cleanMaterial(x.source,500)||source||'外部导入 · 未填写来源',url:safeMaterialURL(x.url)||url||''}}
async function previewMaterialFile(el){let f=el.files[0],owner=modal;if(!f||!owner)return;$('materialConfirm').disabled=true;owner.data=null;try{if(f.size>8*1024*1024)throw Error('文件超过 8 MB');let rows=parseMaterialFile(await f.text(),f.name);if(modal!==owner)return;if(rows.length>10000)throw Error('单次最多 10,000 条，请拆分文件');owner.data={rows,name:f.name};let valid=rows.map(x=>normalizeMaterial(x,'','')).filter(Boolean);let seen=new Set(materialPool('all').map(materialKey));let fresh=valid.filter(x=>{let k=materialKey(x);if(seen.has(k))return false;seen.add(k);return true});$('materialImportPreview').innerHTML=`<div class="notice">读取 ${rows.length} 行；可追加 ${fresh.length} 条，重复或无效 ${rows.length-fresh.length} 条。${fresh.slice(0,3).map(x=>'<br>'+esc(x.en)).join('')}</div>`;$('materialConfirm').disabled=!fresh.length}catch(e){if(modal===owner)$('materialImportPreview').innerHTML=`<div class="notice error">${esc(e.message)}</div>`}}
async function confirmMaterialImport(){if(modal?.kind!=='material-import'||!modal.data)return;let source=cleanMaterial($('materialImportSource').value,500)||'外部文件 · '+modal.data.name,url=safeMaterialURL($('materialImportURL').value),seen=new Set(materialPool('all').map(materialKey));let fresh=modal.data.rows.map(x=>normalizeMaterial(x,source,url)).filter(x=>{if(!x)return false;let k=materialKey(x);if(seen.has(k))return false;seen.add(k);return true});if(!fresh.length){toast('没有可新增的素材。',true);return}let batch={id:'batch-'+uid(),name:modal.data.name,source,url,created:now(),legacy:false,rows:modal.data.rows.length,added:fresh.length};for(let x of fresh){x.id='import-'+uid();x.batchId=batch.id}if(await commit(s=>{s.settings.materialImports=[...arr(s.settings.materialImports),...fresh];s.settings.materialBatches=[...arr(s.settings.materialBatches),batch]},`已追加 ${fresh.length} 条素材，导入记录已保存`)){closeModal(true);Object.assign(materialUI,{q:'',type:'all',source:'imported',task:'all',page:0,onlySaved:false,batch:batch.id});if(route==='materials')render();else render()}}
async function saveMaterial(x){if(!x||savedMaterial(x))return;let note={id:uid(),title:x.en.slice(0,160),category:x.type==='学术词汇'||x.type==='外部词表'?NOTE_TYPES[2]:x.type==='Task 2 论证'?NOTE_TYPES[4]:x.type==='句式与语法'?NOTE_TYPES[3]:NOTE_TYPES[5],content:materialText(x),tags:['每日写作积累',x.type,x.topic].filter(Boolean).join(', '),essayId:x.essayId||'',modelId:x.modelId||'',created:now(),updated:now(),favorite:true,materialKey:materialKey(x)};if(await commit(s=>s.notes.push(note),'已收藏到我的笔记')){if(modal?.kind==='material-detail'){closeModal(true)}render()}}
async function dailyAction(el){let a=el.dataset.action,x=findMaterial(el.dataset.id);switch(a){case 'daily-next':await updateDaily({},true);break;case 'material-type':materialUI.type=el.dataset.type;materialUI.page=0;render();break;case 'material-page':materialUI.page+=Number(el.dataset.dir);refreshMaterials();break;case 'material-detail':if(x)showModal('素材详情',`<div class="daily-main"><div class="row">${tag(x.type,'green')}${tag(x.topic||'未分类')}</div>${materialBody(x)}${materialActions(x)}</div>`,btn('关闭','close-modal'),{kind:'material-detail'});break;case 'material-copy':if(x)await copyText(materialText(x));break;case 'material-save':await saveMaterial(x);break;case 'material-history':batchHistory();break;case 'material-batch-view':openMaterialBatch(el.dataset.id);break;case 'material-batch-delete':await deleteMaterialBatch(el.dataset.id);break;case 'material-delete':await deleteMaterial(el.dataset.id);break;case 'material-sources':materialSources();break;case 'material-import':materialImportDialog();break;case 'material-confirm':await confirmMaterialImport();break;case 'material-export':saveDownload(JSON.stringify({format:'ielts-writing-materials-v1',items:[...DAILY_CORE,...importedMaterials()]},null,2),'IELTS-writing-materials-'+today()+'.json');toast('已生成独立素材库文件（不含个人作文及笔记）');break}}
/* Check local date while the dashboard stays open, without overwriting the existing workspace. */
setInterval(()=>{if(ready&&route==='dashboard'&&!modal&&!pending)ensureDaily()},30000);
window.addEventListener('focus',()=>{if(ready&&!modal&&!pending)ensureDaily()});

(async()=>{try{db=await openDB();let data=await dbRead();if(data){state=validateBackup(data);if(JSON.stringify(state.settings.materialBatches)!==JSON.stringify(data.settings?.materialBatches)||JSON.stringify(state.settings.materialImports)!==JSON.stringify(data.settings?.materialImports))await dbWrite(state)}else await dbWrite(state);ready=true;db.onversionchange=()=>{db.close();ready=false;render()}}catch(e){console.error(e);ready=false}render()})();
</script>
</body></html>
